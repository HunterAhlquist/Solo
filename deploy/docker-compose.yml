# ===========================================================================
# Solo — deployment template (TrueNAS SCALE custom app / docker compose)
#
# TrueNAS SCALE: Apps -> Discover Apps -> ... -> Install via YAML, then paste
# this file (edit the CHANGE_ME values first).
#
# The prebuilt image on GHCR is private for now: only GitHub accounts given
# access to the package can pull it. With access, register the registry
# credential once: Apps -> Configuration -> Manage Container Registries ->
# Add ghcr.io with your GitHub username and a Personal Access Token that has
# the `read:packages` scope. (Plain docker hosts: `docker login ghcr.io`.)
#
# Without access, build the image from a checkout of this repository
# (`docker build -t solo .` at its root) and set `image: solo` below.
# ===========================================================================

services:
  solo:
    image: ghcr.io/hunterahlquist/solo:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # host:container — pick any free host port; the app listens on 8080.
      - "30080:8080"
    environment:
      # -- Database (must match the postgres service below) ------------------
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=solo;Username=solo;Password=CHANGE_ME_DB_PASSWORD"

      # -- OIDC SSO (exactly one provider per deployment) --------------------
      # Google preset:
      #   Auth__Authority: "https://accounts.google.com"
      #   Auth__Provider:  "google"
      # Microsoft Entra ID preset:
      #   Auth__Authority: "https://login.microsoftonline.com/<tenant-id>/v2.0"
      #   Auth__Provider:  "microsoft"
      # Any other OIDC-compliant issuer: use its authority URL + "generic".
      # Google: use the FULL client ID ending in ".apps.googleusercontent.com".
      # A truncated ID still signs in, but every API call 401s — the token's
      # audience is the full string and won't match.
      Auth__Authority: "https://accounts.google.com"
      Auth__ClientId: "CHANGE_ME_OIDC_CLIENT_ID"
      Auth__Provider: "google"

      # -- First-run setup account -------------------------------------------
      # Used only by the setup wizard; permanently disabled after the wizard
      # hands super admin off to your SSO account. Until that handoff these
      # credentials are the way in, and only a per-IP rate limit stands in
      # front of them. The password must be at least 20 characters and not a
      # CHANGE_ME placeholder; otherwise the setup account stays disabled, and
      # the wizard and the startup log say why. To generate one:
      #   openssl rand -base64 32
      Setup__Username: "setup"
      Setup__Password: "CHANGE_ME_SETUP_PASSWORD"

      # -- Themes -------------------------------------------------------------
      # Directory scanned for theme packages (*.zip), backed by the volume
      # mounted below. The three built-in themes ship inside the image and are
      # always available; this is only for ones you add. See docs/themes.md.
      Themes__Directory: "/data/themes"

      # -- Extensions ---------------------------------------------------------
      # Directory scanned for extension packages (*.zip). Unlike themes there is
      # NO rescan: an extension registers controllers, hooks and its own
      # database context before the host is built, so installing, updating or
      # removing one takes a restart of this container.
      #
      # An extension runs in-process with the database connection: installing
      # one is deploying code. Treat a package exactly as you treat this image.
      # See docs/extension-plan.md.
      Extensions__Directory: "/data/extensions"

      # -- Reverse proxy ------------------------------------------------------
      # X-Forwarded-For is what per-IP rate limiting reads, so it is only
      # trusted from a peer that looks like a local reverse proxy: loopback or
      # a private/link-local address. That covers the normal setups — this
      # compose file, a Cloudflare tunnel sidecar, Nginx Proxy Manager on the
      # LAN — and stops a caller on the internet from spoofing the header to
      # mint itself fresh rate-limit buckets.
      #
      # Only needed if your proxy reaches the app from a PUBLIC address; name
      # it here (comma-separated) or its forwarded header will be ignored:
      #   ForwardedHeaders__KnownProxies: "203.0.113.10"
      # Behind two hops (proxy in front of a tunnel), raise the chain depth:
      #   ForwardedHeaders__ForwardLimit: "2"

    volumes:
      # Drop theme .zip files here, then hit Rescan in Admin settings — no
      # restart, and they survive an image update. Named volume by default; to
      # keep them on a specific dataset (which is what makes them easy to copy
      # into), replace with a host path exactly as for the database below:
      #   - /mnt/tank/apps/solo/themes:/data/themes
      #
      # If you do use a host path: the app runs as a non-root user (UID 1654),
      # and the host's ownership wins over the image's, so make the directory
      # readable by that UID. Otherwise no packages load — the app still runs on
      # its built-in themes and says why in Admin settings and the startup log.
      - solo-themes:/data/themes

      # Extension packages. Same ownership caveat as themes above if you swap
      # this for a host path. Removing a package leaves its data in the database
      # on purpose — Admin settings then lists it as installed-but-absent and
      # offers to drop it.
      - solo-extensions:/data/extensions

    # The aspnet base image ships no curl/wget; probe the TCP port via bash.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # -- Optional: Cloudflare Tunnel for public access -------------------------
  # Publishes the app at a public hostname with no port forwarding; TLS
  # terminates at Cloudflare's edge. Create the tunnel under Zero Trust ->
  # Networks -> Tunnels, paste its token below, then add a Public Hostname
  # pointing at service HTTP  solo:8080  — container name and internal port,
  # and the scheme must be http (the container serves no TLS itself).
  # cloudflared:
  #   image: cloudflare/cloudflared:latest
  #   restart: unless-stopped
  #   command: tunnel --no-autoupdate run
  #   environment:
  #     TUNNEL_TOKEN: "CHANGE_ME_TUNNEL_TOKEN"
  #   depends_on:
  #     - solo

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: solo
      POSTGRES_USER: solo
      POSTGRES_PASSWORD: "CHANGE_ME_DB_PASSWORD"
    volumes:
      # Named volume (TrueNAS stores it on the apps pool). To keep the data on
      # a specific dataset instead, replace with a host path, e.g.:
      #   - /mnt/tank/apps/solo/pgdata:/var/lib/postgresql/data
      - solo-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solo -d solo"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  solo-pgdata:
  solo-themes:
  solo-extensions:
