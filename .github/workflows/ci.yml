name: CI

on:
  push:
    # Server releases only. The desktop client has its own `desktop-v*` series
    # and its own workflow, so the two artifacts version independently.
    tags: ["server-v*"]
  pull_request:
    branches: [main]

env:
  IMAGE: ghcr.io/hunterahlquist/solo
  TAG_PREFIX: server-v

jobs:
  # Gate for the whole run. A tag that changes nothing the image is built from
  # would produce a byte-identical container, so it doesn't get built at all.
  # PRs always fall through to the build.
  changes:
    name: Check release inputs
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.diff.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the guard can see origin/main and the diff below
          # can reach earlier tags.
          fetch-depth: 0

      # Tags can point at any commit; only release ones that landed on main.
      - name: Verify tagged commit is on main
        if: github.event_name == 'push'
        run: |
          if git merge-base --is-ancestor HEAD origin/main; then
            echo "Tag ${GITHUB_REF_NAME} is on main."
          else
            echo "::error::Tag ${GITHUB_REF_NAME} points at a commit that is not on main; refusing to build."
            exit 1
          fi

      - name: Diff against the previous server release
        id: diff
        run: |
          set -euo pipefail

          if [ "${GITHUB_EVENT_NAME}" != "push" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Everything that reaches the image, plus the sources the gating
          # tests cover. Deliberately excludes src/Solo.Desktop, Icons/, docs,
          # and the desktop workflow — none of them change the container.
          PATHS=(
            Dockerfile
            .dockerignore
            Solo.slnx
            src/Solo.Api
            src/Solo.Client
            src/Solo.Data
            src/Solo.Extensibility
            src/Solo.Extensions
            src/Solo.Mcp
            src/Solo.Mcp.Client
            src/Solo.Shared
            tests
            build
            .github/workflows/ci.yml
          )

          # Nearest earlier tag in this series that HEAD descends from. The
          # --exclude keeps the tag being pushed from matching itself; when a
          # second tag sits on the same commit the diff is correctly empty.
          PREVIOUS=$(git describe --tags --abbrev=0 --match "${TAG_PREFIX}*" \
            --exclude "${GITHUB_REF_NAME}" HEAD 2>/dev/null || true)

          if [ -z "${PREVIOUS}" ]; then
            echo "No earlier ${TAG_PREFIX}* tag in this history — building."
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --quiet "${PREVIOUS}" HEAD -- "${PATHS[@]}"; then
            echo "::notice::Nothing the image is built from changed since ${PREVIOUS}; skipping build and publish."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Changed since ${PREVIOUS}:"
            git diff --name-only "${PREVIOUS}" HEAD -- "${PATHS[@]}"
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build-test:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Solo.slnx

      - name: Build
        run: dotnet build Solo.slnx --no-restore -c Release

      # Integration tests spin up Postgres via Testcontainers; the ubuntu
      # runner's Docker daemon covers that. bUnit component tests for
      # Solo.Client run in the same pass — they need no browser.
      - name: Test
        run: dotnet test Solo.slnx --no-build -c Release --logger "trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          retention-days: 7

      # The MCP server ships as an extension package rather than inside the
      # image: an operator drops it into the extensions volume and restarts.
      # Built on every run so a PR proves the package still assembles, and
      # attached to the release below when a tag is pushed.
      - name: Package the MCP extension
        run: build/pack-mcp-extension.sh

      - name: Upload the MCP extension package
        uses: actions/upload-artifact@v4
        with:
          name: mcp-extension
          path: artifacts/solo-mcp-*.zip
          if-no-files-found: error
          retention-days: 7

  publish-image:
    name: Publish image to GHCR
    needs: [changes, build-test]
    # Publish only when a server-v* tag is pushed; PR builds just validate.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/server-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # `type=semver` only parses a bare `v1.2.3`, so the prefix is peeled
          # off with `type=match` instead: the first pattern yields the exact
          # version (`server-v1.6.0-rc1` → `1.6.0-rc1`), the second the floating
          # `1.6` — anchored, so a prerelease never claims the minor tag.
          #
          # This job only runs on server-v* tag pushes, so latest always points
          # at the newest release — deploy/docker-compose.yml pulls :latest.
          tags: |
            type=raw,value=latest
            type=match,pattern=server-v(\d+\.\d+\.\d+.*),group=1
            type=match,pattern=server-v(\d+\.\d+)\.\d+$,group=1
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release-extension:
    name: Attach the MCP extension to the release
    needs: [changes, build-test]
    # Tag pushes only; a PR build just proves the package assembles.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/server-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mcp-extension
          path: artifacts

      # Creates the release for the tag if it doesn't exist yet; otherwise
      # attaches the package to the existing one. The image is published
      # separately to GHCR — this release carries what an operator installs by
      # hand.
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/solo-mcp-*.zip
          generate_release_notes: true

  # NO AUTOMATIC GHCR PRUNING. A `prune-images` job lived here for exactly one
  # release (v1.4.1, 2026-07-30) and took production down with
  # `manifest unknown`.
  #
  # Why it cannot work as written: buildx pushes an OCI *image index*, not a
  # single manifest — the real image and the provenance attestation that
  # docker/build-push-action attaches by default are child manifests, and GHCR
  # lists those children as untagged versions. "Delete untagged versions"
  # therefore deletes the innards of the image `latest` points at. The tag
  # survives, resolves to an index whose children are gone, and every pull
  # fails. `min-versions-to-keep` has the same flaw: it counts those children
  # as versions.
  #
  # If GHCR storage needs trimming, delete whole versions by digest after
  # checking what each one's index references — by hand, or with a script that
  # walks the index. Do not re-add a blanket untagged sweep.
