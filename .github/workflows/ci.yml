name: CI

on:
  push:
    # Server releases only. The desktop client has its own `desktop-v*` series
    # and its own workflow, so the two artifacts version independently.
    tags: ["server-v*"]
  pull_request:
    branches: [main]

env:
  IMAGE: ghcr.io/hunterahlquist/solo
  TAG_PREFIX: server-v

jobs:
  # Decide what this tag actually releases. The server image and the extension
  # packages have overlapping dependencies, but none should be republished
  # merely because another one (or tests/docs/release plumbing) changed.
  changes:
    name: Check release inputs
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.diff.outputs.server }}
      mcp: ${{ steps.diff.outputs.mcp }}
      roadmap: ${{ steps.diff.outputs.roadmap }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the guard can see origin/main and the diff below
          # can reach earlier tags.
          fetch-depth: 0

      # Tags can point at any commit; only release ones that landed on main.
      - name: Verify tagged commit is on main
        if: github.event_name == 'push'
        run: |
          if git merge-base --is-ancestor HEAD origin/main; then
            echo "Tag ${GITHUB_REF_NAME} is on main."
          else
            echo "::error::Tag ${GITHUB_REF_NAME} points at a commit that is not on main; refusing to build."
            exit 1
          fi

      - name: Diff against the previous server release
        id: diff
        run: |
          set -euo pipefail

          if [ "${GITHUB_EVENT_NAME}" != "push" ]; then
            echo "server=true" >> "$GITHUB_OUTPUT"
            echo "mcp=true" >> "$GITHUB_OUTPUT"
            echo "roadmap=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The project-reference closure published by Solo.Api, plus the two
          # files that define the container. Tests, MCP/Desktop sources, the
          # solution file, workflow changes, and local launch settings cannot
          # alter the final image.
          SERVER_PATHS=(
            Dockerfile
            .dockerignore
            src/Solo.Api
            src/Solo.Client
            src/Solo.Data
            src/Solo.Extensibility
            src/Solo.Extensions
            src/Solo.Shared
            ":(exclude)src/Solo.Api/Properties/launchSettings.json"
          )

          # Source and packaging inputs that can change the installable MCP
          # package. Solo.Shared is included both for the client and as a
          # transitive dependency of Solo.Extensibility; its READMEs are not
          # copied into the package.
          MCP_PATHS=(
            src/Solo.Extensibility
            src/Solo.Mcp
            src/Solo.Mcp.Client
            src/Solo.Shared
            build/pack-mcp-extension.sh
            ":(exclude)src/Solo.Mcp/README.md"
            ":(exclude)src/Solo.Mcp.Client/README.md"
          )

          # The same, for the Roadmaps package.
          ROADMAP_PATHS=(
            src/Solo.Extensibility
            src/Solo.Roadmap
            src/Solo.Roadmap.Client
            src/Solo.Shared
            build/pack-roadmap-extension.sh
            ":(exclude)src/Solo.Roadmap/README.md"
          )

          # Nearest earlier tag in this series that HEAD descends from. The
          # --exclude keeps the tag being pushed from matching itself; when a
          # second tag sits on the same commit the diff is correctly empty.
          PREVIOUS=$(git describe --tags --abbrev=0 --match "${TAG_PREFIX}*" \
            --exclude "${GITHUB_REF_NAME}" HEAD 2>/dev/null || true)

          if [ -z "${PREVIOUS}" ]; then
            echo "No earlier ${TAG_PREFIX}* tag in this history — building."
            echo "server=true" >> "$GITHUB_OUTPUT"
            echo "mcp=true" >> "$GITHUB_OUTPUT"
            echo "roadmap=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --quiet "${PREVIOUS}" HEAD -- "${SERVER_PATHS[@]}"; then
            echo "::notice::No server image inputs changed since ${PREVIOUS}; skipping image publication."
            echo "server=false" >> "$GITHUB_OUTPUT"
          else
            echo "Server image inputs changed since ${PREVIOUS}:"
            git diff --name-only "${PREVIOUS}" HEAD -- "${SERVER_PATHS[@]}"
            echo "server=true" >> "$GITHUB_OUTPUT"
          fi

          if git diff --quiet "${PREVIOUS}" HEAD -- "${MCP_PATHS[@]}"; then
            echo "::notice::No MCP package inputs changed since ${PREVIOUS}; skipping extension publication."
            echo "mcp=false" >> "$GITHUB_OUTPUT"
          else
            echo "MCP package inputs changed since ${PREVIOUS}:"
            git diff --name-only "${PREVIOUS}" HEAD -- "${MCP_PATHS[@]}"
            echo "mcp=true" >> "$GITHUB_OUTPUT"
          fi

          if git diff --quiet "${PREVIOUS}" HEAD -- "${ROADMAP_PATHS[@]}"; then
            echo "::notice::No Roadmaps package inputs changed since ${PREVIOUS}; skipping extension publication."
            echo "roadmap=false" >> "$GITHUB_OUTPUT"
          else
            echo "Roadmaps package inputs changed since ${PREVIOUS}:"
            git diff --name-only "${PREVIOUS}" HEAD -- "${ROADMAP_PATHS[@]}"
            echo "roadmap=true" >> "$GITHUB_OUTPUT"
          fi

  build-test:
    needs: changes
    if: >-
      needs.changes.outputs.server == 'true' ||
      needs.changes.outputs.mcp == 'true' ||
      needs.changes.outputs.roadmap == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Solo.slnx

      - name: Build
        run: dotnet build Solo.slnx --no-restore -c Release

      # Integration tests spin up Postgres via Testcontainers; the ubuntu
      # runner's Docker daemon covers that. bUnit component tests for
      # Solo.Client run in the same pass — they need no browser.
      - name: Test
        run: dotnet test Solo.slnx --no-build -c Release --logger "trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults
          retention-days: 7

      # The MCP server ships as an extension package rather than inside the
      # image: an operator drops it into the extensions volume and restarts.
      # Every PR proves the package still assembles. A tagged build only packs
      # it when an input changed since the previous server release.
      - name: Package the MCP extension
        if: github.event_name == 'pull_request' || needs.changes.outputs.mcp == 'true'
        run: build/pack-mcp-extension.sh

      - name: Upload the MCP extension package
        if: github.event_name == 'pull_request' || needs.changes.outputs.mcp == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: mcp-extension
          path: artifacts/solo-mcp-*.zip
          if-no-files-found: error
          retention-days: 7

      # The Roadmaps extension, packaged and gated the same way.
      - name: Package the Roadmaps extension
        if: github.event_name == 'pull_request' || needs.changes.outputs.roadmap == 'true'
        run: build/pack-roadmap-extension.sh

      - name: Upload the Roadmaps extension package
        if: github.event_name == 'pull_request' || needs.changes.outputs.roadmap == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: roadmap-extension
          path: artifacts/solo-roadmap-*.zip
          if-no-files-found: error
          retention-days: 7

  publish-image:
    name: Publish image to GHCR
    needs: [changes, build-test]
    # PR builds just validate. An extension-only tag must not move the server tags.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/server-v') && needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # `type=semver` only parses a bare `v1.2.3`, so the prefix is peeled
          # off with `type=match` instead: the first pattern yields the exact
          # version (`server-v1.6.0-rc1` → `1.6.0-rc1`), the second the floating
          # `1.6` — anchored, so a prerelease never claims the minor tag.
          #
          # This job only runs when server inputs changed, so latest points at
          # the newest server release — deploy/docker-compose.yml pulls it.
          tags: |
            type=raw,value=latest
            type=match,pattern=server-v(\d+\.\d+\.\d+.*),group=1
            type=match,pattern=server-v(\d+\.\d+)\.\d+$,group=1
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Publish changed release artifacts
    needs: [changes, build-test, publish-image]
    # `always()` lets an extension-only release proceed past the intentionally
    # skipped image job. A changed server must have published successfully
    # before its GitHub release is created.
    if: >-
      always() &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/server-v') &&
      needs.build-test.result == 'success' &&
      (needs.changes.outputs.server == 'true' ||
       needs.changes.outputs.mcp == 'true' ||
       needs.changes.outputs.roadmap == 'true') &&
      (needs.changes.outputs.server != 'true' || needs.publish-image.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        if: needs.changes.outputs.mcp == 'true'
        with:
          name: mcp-extension
          path: artifacts

      - uses: actions/download-artifact@v8
        if: needs.changes.outputs.roadmap == 'true'
        with:
          name: roadmap-extension
          path: artifacts

      # A changed server still gets release notes when no extension changed;
      # an already-published package is not attached again.
      - name: Create release without unchanged extension packages
        if: needs.changes.outputs.mcp != 'true' && needs.changes.outputs.roadmap != 'true'
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true

      # Creates the release for the tag if it doesn't exist yet; otherwise
      # attaches the changed packages — only those were downloaded above. The
      # image is published separately to GHCR; these assets are what an
      # operator installs by hand.
      - name: Create release and attach the changed extension packages
        if: needs.changes.outputs.mcp == 'true' || needs.changes.outputs.roadmap == 'true'
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/solo-*.zip
          generate_release_notes: true

  # NO AUTOMATIC GHCR PRUNING. A `prune-images` job lived here for exactly one
  # release (v1.4.1, 2026-07-30) and took production down with
  # `manifest unknown`.
  #
  # Why it cannot work as written: buildx pushes an OCI *image index*, not a
  # single manifest — the real image and the provenance attestation that
  # docker/build-push-action attaches by default are child manifests, and GHCR
  # lists those children as untagged versions. "Delete untagged versions"
  # therefore deletes the innards of the image `latest` points at. The tag
  # survives, resolves to an index whose children are gone, and every pull
  # fails. `min-versions-to-keep` has the same flaw: it counts those children
  # as versions.
  #
  # If GHCR storage needs trimming, delete whole versions by digest after
  # checking what each one's index references — by hand, or with a script that
  # walks the index. Do not re-add a blanket untagged sweep.
