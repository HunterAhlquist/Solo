name: CI

on:
  push:
    # One release series for the whole train. A `v*` tag runs this workflow and
    # Desktop Release from the same commit, and both attach to the one GitHub
    # release for that tag — so a train that moved the server and the app does
    # not bury one behind the other, and exactly one release holds "latest".
    # `preview-v*` is the same thing published as a prerelease.
    tags: ["v*", "preview-v*"]
  pull_request:
    branches: [main]

# Every job starts read-only. The few that publish (the image, the release)
# ask for exactly what they write, in their own permissions block.
permissions:
  contents: read

env:
  IMAGE: ghcr.io/hunterahlquist/solo
  TAG_PREFIX: v

jobs:
  # Decide what this tag actually releases. The server image and the extension
  # packages have overlapping dependencies, but none should be republished
  # merely because another one (or tests/docs/release plumbing) changed.
  changes:
    name: Check release inputs
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.diff.outputs.server }}
      previous: ${{ steps.diff.outputs.previous }}
      version: ${{ steps.channel.outputs.version }}
      prerelease: ${{ steps.channel.outputs.prerelease }}
      preview_channel: ${{ steps.channel.outputs.preview_channel }}
      package_label: ${{ steps.channel.outputs.package_label }}
      mcp: ${{ steps.diff.outputs.mcp }}
      roadmap: ${{ steps.diff.outputs.roadmap }}
      design_docs: ${{ steps.diff.outputs.design_docs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the guard can see origin/main and the diff below
          # can reach earlier tags.
          fetch-depth: 0

      - name: Classify the release channel
        id: channel
        if: github.event_name == 'push'
        run: bash build/release-channel.sh "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

      # Stable tags must have landed on main; prereleases can test an unmerged branch.
      - name: Verify tagged commit is on main
        if: github.event_name == 'push' && steps.channel.outputs.prerelease != 'true'
        run: |
          if git merge-base --is-ancestor HEAD origin/main; then
            echo "Tag ${GITHUB_REF_NAME} is on main."
          else
            echo "::error::Tag ${GITHUB_REF_NAME} points at a commit that is not on main; refusing to build."
            exit 1
          fi

      - name: Diff against the previous release
        id: diff
        env:
          IS_PRERELEASE: ${{ steps.channel.outputs.prerelease }}
        run: |
          set -euo pipefail

          # Nearest earlier stable tag in this series that HEAD descends from.
          # The --exclude keeps the tag being pushed from matching itself; when a
          # second tag sits on the same commit the diff is correctly empty.
          # Resolved before the short-circuits below because the release job
          # needs it whatever this one decides: it is where an unchanged
          # component's manifest entry is carried forward from.
          PREVIOUS=$(git describe --tags --abbrev=0 --match "${TAG_PREFIX}*" \
            --exclude "${GITHUB_REF_NAME}" --exclude "${TAG_PREFIX}*-*" HEAD 2>/dev/null || true)
          echo "previous=${PREVIOUS}" >> "$GITHUB_OUTPUT"

          if [ "${GITHUB_EVENT_NAME}" != "push" ] || [ "$IS_PRERELEASE" = "true" ]; then
            echo "server=true" >> "$GITHUB_OUTPUT"
            echo "mcp=true" >> "$GITHUB_OUTPUT"
            echo "roadmap=true" >> "$GITHUB_OUTPUT"
            echo "design_docs=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The project-reference closure published by Solo.Api, plus the two
          # files that define the container. Tests, extensions/, Desktop
          # sources, the solution file, workflow changes, and local launch
          # settings cannot alter the final image.
          SERVER_PATHS=(
            Dockerfile
            .dockerignore
            src/Solo.Api
            src/Solo.Client
            src/Solo.Data
            src/Solo.Extensibility
            src/Solo.Extensions
            src/Solo.Shared
            ":(exclude)src/Solo.Api/Properties/launchSettings.json"
          )

          # Source and packaging inputs that can change the installable MCP
          # package. Both halves build from the contract packages, which are
          # packed from src/Solo.Extensibility and src/Solo.Shared on every run,
          # so those stay inputs. Its tests and READMEs are not copied into the
          # package.
          MCP_PATHS=(
            src/Solo.Extensibility
            src/Solo.Shared
            extensions/nuget.config
            extensions/Mcp/Solo.Mcp
            extensions/Mcp/Solo.Mcp.Client
            build/pack-mcp-extension.sh
            ":(exclude)extensions/Mcp/Solo.Mcp/README.md"
            ":(exclude)extensions/Mcp/Solo.Mcp.Client/README.md"
          )

          # The same, for the Roadmaps package.
          ROADMAP_PATHS=(
            src/Solo.Extensibility
            src/Solo.Shared
            extensions/nuget.config
            extensions/Roadmap/Solo.Roadmap
            extensions/Roadmap/Solo.Roadmap.Client
            build/pack-roadmap-extension.sh
            ":(exclude)extensions/Roadmap/Solo.Roadmap/README.md"
          )

          DESIGN_DOCS_PATHS=(
            src/Solo.Extensibility src/Solo.Shared extensions/nuget.config
            extensions/DesignDocs/Solo.DesignDocs extensions/DesignDocs/Solo.DesignDocs.Client
            build/pack-design-docs-extension.sh
            ":(exclude)extensions/DesignDocs/Solo.DesignDocs/README.md"
            ":(exclude)extensions/DesignDocs/Solo.DesignDocs.Client/README.md"
          )

          # The first release of this unified series has no earlier `v*` tag to
          # measure against, so it builds and attaches everything. That is also
          # what establishes the complete manifest every later release carries
          # its unchanged components forward from.
          if [ -z "${PREVIOUS}" ]; then
            echo "No earlier ${TAG_PREFIX}* tag in this history — building."
            echo "server=true" >> "$GITHUB_OUTPUT"
            echo "mcp=true" >> "$GITHUB_OUTPUT"
            echo "roadmap=true" >> "$GITHUB_OUTPUT"
            echo "design_docs=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --quiet "${PREVIOUS}" HEAD -- "${SERVER_PATHS[@]}"; then
            echo "::notice::No server image inputs changed since ${PREVIOUS}; skipping image publication."
            echo "server=false" >> "$GITHUB_OUTPUT"
          else
            echo "Server image inputs changed since ${PREVIOUS}:"
            git diff --name-only "${PREVIOUS}" HEAD -- "${SERVER_PATHS[@]}"
            echo "server=true" >> "$GITHUB_OUTPUT"
          fi

          if git diff --quiet "${PREVIOUS}" HEAD -- "${MCP_PATHS[@]}"; then
            echo "::notice::No MCP package inputs changed since ${PREVIOUS}; skipping extension publication."
            echo "mcp=false" >> "$GITHUB_OUTPUT"
          else
            echo "MCP package inputs changed since ${PREVIOUS}:"
            git diff --name-only "${PREVIOUS}" HEAD -- "${MCP_PATHS[@]}"
            echo "mcp=true" >> "$GITHUB_OUTPUT"
          fi

          if git diff --quiet "${PREVIOUS}" HEAD -- "${ROADMAP_PATHS[@]}"; then
            echo "::notice::No Roadmaps package inputs changed since ${PREVIOUS}; skipping extension publication."
            echo "roadmap=false" >> "$GITHUB_OUTPUT"
          else
            echo "Roadmaps package inputs changed since ${PREVIOUS}:"
            git diff --name-only "${PREVIOUS}" HEAD -- "${ROADMAP_PATHS[@]}"
            echo "roadmap=true" >> "$GITHUB_OUTPUT"
          fi

          if git diff --quiet "${PREVIOUS}" HEAD -- "${DESIGN_DOCS_PATHS[@]}"; then
            echo "::notice::No Design Docs package inputs changed since ${PREVIOUS}; skipping extension publication."
            echo "design_docs=false" >> "$GITHUB_OUTPUT"
          else
            echo "Design Docs package inputs changed since ${PREVIOUS}:"
            git diff --name-only "${PREVIOUS}" HEAD -- "${DESIGN_DOCS_PATHS[@]}"
            echo "design_docs=true" >> "$GITHUB_OUTPUT"
          fi

  build-test:
    needs: changes
    if: >-
      needs.changes.outputs.server == 'true' ||
      needs.changes.outputs.mcp == 'true' ||
      needs.changes.outputs.roadmap == 'true' ||
      needs.changes.outputs.design_docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Check browser input, offline caching and release assembly
        run: node --test build/test-tooltip-input.mjs build/test-offline-cache.mjs build/test-release-artifacts.mjs

      - name: Check release channels, manifest baselines and release gating
        run: |
          bash build/test-release-channel.sh
          bash build/test-release-baseline.sh
          bash build/test-release-gating.sh

      - name: Restore
        run: dotnet restore Solo.slnx

      - name: Build
        run: dotnet build Solo.slnx --no-restore -c Release

      # Integration tests spin up Postgres via Testcontainers; the ubuntu
      # runner's Docker daemon covers that. bUnit component tests for
      # Solo.Client run in the same pass — they need no browser.
      - name: Test
        run: dotnet test Solo.slnx --no-build -c Release --logger "trx" --results-directory TestResults

      # The extension contract as NuGet packages, and proof that
      # samples/HelloExtension builds from them with nothing else from this
      # repository. Packed on every run and neither uploaded nor pushed: the
      # packages go to nuget.org from release-sdk.yml on an `sdk-v*` tag
      # rather than from here. artifacts/nuget, where this leaves them, is
      # also the only source the extensions below restore the contract from
      # (extensions/nuget.config), whatever nuget.org holds.
      - name: Package the extension contract
        run: build/pack-contract.sh

      # The `dotnet new` template for extensions. Packed, installed into a
      # throwaway template hive, and an extension generated from it for each
      # combination of its options — each one built and packaged against the
      # contract packages above, and its first migration checked against its
      # model. Not pushed from here either: a `templates-v*` tag does that, in
      # release-sdk.yml.
      - name: Package the extension templates
        run: build/pack-templates.sh

      # Each extension is its own solution under extensions/, outside
      # Solo.slnx. Its tests load the package into the real host, so they run
      # whenever this job does: a change to core can break an extension that
      # did not change.
      - name: Test the MCP extension
        run: dotnet test extensions/Mcp/Solo.Mcp.slnx -c Release --logger "trx" --results-directory TestResults

      - name: Test the Roadmaps extension
        run: dotnet test extensions/Roadmap/Solo.Roadmap.slnx -c Release --logger "trx" --results-directory TestResults

      # The MCP server ships as an extension package rather than inside the
      # image: an operator drops it into the extensions volume and restarts.
      # Every PR proves the package still assembles. A tagged build only packs
      # it when an input changed since the previous server release.
      - name: Package the MCP extension
        if: github.event_name == 'pull_request' || needs.changes.outputs.mcp == 'true'
        run: build/pack-mcp-extension.sh

      - name: Upload the MCP extension package
        if: github.event_name == 'pull_request' || needs.changes.outputs.mcp == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcp-extension
          path: artifacts/solo-mcp-*.zip
          if-no-files-found: error
          retention-days: 7

      # The Roadmaps extension, packaged and gated the same way.
      - name: Package the Roadmaps extension
        if: github.event_name == 'pull_request' || needs.changes.outputs.roadmap == 'true'
        run: build/pack-roadmap-extension.sh

      - name: Upload the Roadmaps extension package
        if: github.event_name == 'pull_request' || needs.changes.outputs.roadmap == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: roadmap-extension
          path: artifacts/solo-roadmap-*.zip
          if-no-files-found: error
          retention-days: 7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Package the Design Docs extension
        run: build/pack-design-docs-extension.sh

      - name: Test the Design Docs extension
        run: dotnet test extensions/DesignDocs/Solo.DesignDocs.slnx -c Release --logger "trx" --results-directory TestResults

      - name: Upload the Design Docs extension package
        if: github.event_name == 'pull_request' || needs.changes.outputs.design_docs == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: design-docs-extension
          path: artifacts/solo-design-docs-*.zip
          if-no-files-found: error
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: TestResults
          retention-days: 7


  publish-image:
    name: Publish image to GHCR
    needs: [changes, build-test]
    # PR builds just validate. An extension-only tag must not move the server tags.
    if: github.event_name == 'push' && needs.changes.outputs.version != '' && needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          # Classification is shared with the branch guard and GitHub release.
          # Explicit latest handling keeps previews off stable deployments;
          # the anchored minor pattern admits stable server tags only.
          tags: |
            type=raw,value=latest,enable=${{ needs.changes.outputs.prerelease != 'true' }}
            type=raw,value=${{ needs.changes.outputs.preview_channel }},enable=${{ needs.changes.outputs.prerelease == 'true' }}
            type=raw,value=${{ needs.changes.outputs.version }}
            type=match,pattern=^v(\d+\.\d+)\.\d+$,group=1
            type=sha,prefix=sha-

      # The version the image tags carry, for the app itself to report
      # (Dockerfile SOLO_VERSION): `v1.18.0-rc.1` → `1.18.0-rc.1`.
      - name: Release version
        id: version
        env:
          VERSION: ${{ needs.changes.outputs.version }}
        run: echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SOLO_VERSION=${{ steps.version.outputs.version }}
            SOLO_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    # Both this workflow and Desktop Release write the one GitHub release for
    # this tag, and both merge into the one release-manifest.json on it. A
    # concurrency group is repository-wide, so naming the same one in both
    # serialises them and neither loses the other's merge.
    concurrency:
      group: github-release-${{ github.ref }}
      cancel-in-progress: false
    name: Publish the changed release artifacts
    needs: [changes, build-test, publish-image]
    # `always()` lets this proceed past the intentionally skipped image job, and
    # lets a train that changed nothing on the server still publish the release
    # and carry its manifest forward. A changed server must have published to
    # GHCR successfully before its release is created.
    if: >-
      always() &&
      github.event_name == 'push' &&
      needs.changes.outputs.version != '' &&
      (needs.build-test.result == 'success' || needs.build-test.result == 'skipped') &&
      (needs.changes.outputs.server != 'true' || needs.publish-image.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      PREVIOUS: ${{ needs.changes.outputs.previous }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # For build/release-manifest.mjs and the contract version it records.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.changes.outputs.mcp == 'true'
        with:
          name: mcp-extension
          path: artifacts

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.changes.outputs.roadmap == 'true'
        with:
          name: roadmap-extension
          path: artifacts

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.changes.outputs.design_docs == 'true'
        with:
          name: design-docs-extension
          path: artifacts

      - name: Label agent preview packages
        if: needs.changes.outputs.package_label != ''
        env:
          PACKAGE_LABEL: ${{ needs.changes.outputs.package_label }}
        run: |
          shopt -s nullglob
          for package in artifacts/solo-*.zip; do
            mv "$package" "${package%.zip}-$PACKAGE_LABEL.zip"
          done

      # What this release's manifest starts from. An extension, the server or
      # the desktop app that this train did not rebuild keeps the entry it
      # already had — version, release tag and download URL — so the newest
      # release's manifest always describes the whole product even though its
      # own assets are only the parts that changed.
      - name: Resolve the baseline manifest
        id: baseline
        run: |
          set -euo pipefail
          path=$(bash build/release-baseline.sh "$TAG" "$PREVIOUS" baseline)
          echo "path=${path}" >> "$GITHUB_OUTPUT"

      # The server half. `contract` is the version soloApiVersion is checked
      # against (ContractVersion.Current), so an extension updater can tell
      # whether a newer package would load on this server at all.
      - name: Describe the server
        if: needs.changes.outputs.server == 'true'
        env:
          VERSION: ${{ needs.changes.outputs.version }}
        run: |
          set -euo pipefail
          contract=$(sed -n 's/.*<Version>\(.*\)<\/Version>.*/\1/p' build/contract-package.props | head -1)
          node -e '
            const [version, tag, image, contract] = process.argv.slice(1);
            process.stdout.write(JSON.stringify({ server: {
              version, release: tag, image: `${image}:${version}`, contract,
            } }));
          ' "$VERSION" "$TAG" "$IMAGE" "$contract" > server.json
          cat server.json

      - name: Assemble the release manifest
        env:
          VERSION: ${{ needs.changes.outputs.version }}
          PRERELEASE: ${{ needs.changes.outputs.prerelease }}
          BASELINE: ${{ steps.baseline.outputs.path }}
        run: |
          set -euo pipefail
          args=(--out release-manifest.json --tag "$TAG" --version "$VERSION" --prerelease "$PRERELEASE"
                --packages artifacts
                --base "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${TAG}/")
          if [ -n "$BASELINE" ]; then args+=(--baseline "$BASELINE"); fi
          if [ -f server.json ]; then args+=(--fragment server.json); fi
          node build/release-manifest.mjs "${args[@]}"

      # Creates the release for the tag if it doesn't exist yet; otherwise adds
      # to the one Desktop Release created. Only the extension packages that
      # changed were downloaded above, so only those are attached — the rest
      # stay on the release that built them, which the manifest still points at.
      # The image went to GHCR; these assets are what an operator installs.
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            release-manifest.json
            artifacts/solo-*.zip
          fail_on_unmatched_files: false
          generate_release_notes: true
          prerelease: ${{ needs.changes.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.changes.outputs.prerelease == 'true' && 'false' || 'legacy' }}

  # NO AUTOMATIC GHCR PRUNING. A `prune-images` job lived here for exactly one
  # release (v1.4.1, 2026-07-30) and took production down with
  # `manifest unknown`.
  #
  # Why it cannot work as written: buildx pushes an OCI *image index*, not a
  # single manifest — the real image and the provenance attestation that
  # docker/build-push-action attaches by default are child manifests, and GHCR
  # lists those children as untagged versions. "Delete untagged versions"
  # therefore deletes the innards of the image `latest` points at. The tag
  # survives, resolves to an index whose children are gone, and every pull
  # fails. `min-versions-to-keep` has the same flaw: it counts those children
  # as versions.
  #
  # If GHCR storage needs trimming, delete whole versions by digest after
  # checking what each one's index references — by hand, or with a script that
  # walks the index. Do not re-add a blanket untagged sweep.
