name: SDK Release

on:
  push:
    # The extension SDK only: the two contract packages an extension compiles
    # against, published to nuget.org. The container image, the desktop client
    # and the extension packages are released together on a `v*` tag by ci.yml
    # and release-desktop.yml; the contract versions independently of all three.
    #
    # `templates-v*` publishes the `dotnet new` template package instead. It is
    # a series of its own because a template can be fixed without the contract
    # moving, and it lives in this file because the nuget.org trusted-publishing
    # policy names this workflow: a second file would need a second policy.
    tags: ["sdk-v*", "templates-v*"]
  # A manual run is a rehearsal: everything up to the push, with the packages
  # left as a workflow artifact to look at. It publishes nothing.
  workflow_dispatch:

# Every job starts read-only. The publish job asks for the one thing it needs,
# in its own permissions block.
permissions:
  contents: read

env:
  TAG_PREFIX: sdk-v
  TEMPLATES_TAG_PREFIX: templates-v

# nuget.org keeps every version it accepts, so two runs never push at once.
concurrency:
  group: sdk-release
  cancel-in-progress: false

jobs:
  # Everything that can refuse a release happens here, in a job that holds no
  # credential. The publish job below only pushes what this one uploaded.
  pack:
    name: Verify and pack
    # A templates tag publishes the templates and leaves the contract alone.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref_name, 'sdk-v')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the guard can see origin/main.
          fetch-depth: 0

      # Tags can point at any commit; only release ones that landed on main.
      - name: Verify tagged commit is on main
        if: github.event_name == 'push'
        run: |
          if git merge-base --is-ancestor HEAD origin/main; then
            echo "Tag ${GITHUB_REF_NAME} is on main."
          else
            echo "::error::Tag ${GITHUB_REF_NAME} points at a commit that is not on main; refusing to publish."
            exit 1
          fi

      # Every package page links back to this repository, and nuget.org never
      # deletes a version — so a release from a private repository would leave
      # dead links up for good. Asked of the API rather than read from the
      # event, so re-running a refused run after going public passes.
      - name: Verify the repository is public
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh api "repos/${GITHUB_REPOSITORY}" --jq .private)" != "false" ]; then
            echo "::error::${GITHUB_REPOSITORY} is not public; refusing to publish. Make it public, then re-run this workflow."
            exit 1
          fi

      # The tag names a version, but the packages take theirs from
      # build/contract-package.props. They have to agree, or the tag would
      # publish a version it doesn't name.
      - name: Read the contract version
        id: version
        run: |
          set -euo pipefail

          version=$(sed -n 's/.*<Version>\(.*\)<\/Version>.*/\1/p' build/contract-package.props | head -1)
          if [ -z "${version}" ]; then
            echo "::error::No <Version> in build/contract-package.props."
            exit 1
          fi

          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            tagged="${GITHUB_REF_NAME#"${TAG_PREFIX}"}"
            if [ "${tagged}" != "${version}" ]; then
              echo "::error::Tag ${GITHUB_REF_NAME} names ${tagged}, but the contract is ${version}. Tag ${TAG_PREFIX}${version}, or bump the contract first."
              exit 1
            fi
          fi

          echo "Contract version ${version}."
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      # The same checks ci.yml runs on a pull request, repeated here because a
      # tag can sit on a commit pushed straight to main, which CI never saw —
      # and a published version can't be taken back. The suite includes
      # ContractPackageTests, which holds the package version to
      # ContractVersion.Current.
      - name: Restore
        run: dotnet restore Solo.slnx

      - name: Build
        run: dotnet build Solo.slnx --no-restore -c Release

      - name: Test
        run: dotnet test Solo.slnx --no-build -c Release

      # Packs both packages into artifacts/nuget and builds
      # samples/HelloExtension from them alone, outside the repository.
      - name: Package the extension contract
        run: build/pack-contract.sh

      # The bundled extensions restore the contract from the folder just
      # written and load into the real host, so these exercise the very
      # packages about to be published.
      - name: Test the MCP extension
        run: dotnet test extensions/Mcp/Solo.Mcp.slnx -c Release

      - name: Test the Roadmaps extension
        run: dotnet test extensions/Roadmap/Solo.Roadmap.slnx -c Release

      - name: Upload the packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdk-packages
          path: |
            artifacts/nuget/HunterAhlquist.Solo.*.${{ steps.version.outputs.version }}.nupkg
            artifacts/nuget/HunterAhlquist.Solo.*.${{ steps.version.outputs.version }}.snupkg
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to nuget.org
    needs: pack
    # Only a tag publishes; a manual run stops at the artifact.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # The environment the nuget.org trusted-publishing policy is restricted to.
    # Give it a required reviewer (Settings -> Environments) and this job waits
    # for an approval, which leaves time to look at the artifact first.
    environment: nuget
    permissions:
      # Lets the job ask GitHub for an identity token, which nuget.org
      # exchanges for an API key that lasts an hour. No key is stored anywhere.
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdk-packages
          path: packages

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      # NUGET_USER is the nuget.org profile name that owns the packages. A
      # repository variable rather than a secret: it is public on every package
      # page, and Actions masks a secret's value wherever it appears in a log,
      # which would blank the owner prefix out of every package name below.
      - name: Check the nuget.org user is set
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: |
          if [ -z "${NUGET_USER}" ]; then
            echo "::error::Set the NUGET_USER repository variable to the nuget.org profile name that owns the packages."
            exit 1
          fi

      # Asked for here, immediately before the push, because the key it
      # returns expires after an hour.
      - name: Log in to nuget.org
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}

      # Shared first: Extensibility depends on it, so the dependency is never
      # the one that is missing. --skip-duplicate makes a run that failed
      # between the two safe to re-run — the version nuget.org already holds is
      # skipped rather than refused. Each .snupkg beside a package goes to the
      # symbol server with it.
      - name: Push
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
          VERSION: ${{ needs.pack.outputs.version }}
        run: |
          set -euo pipefail

          for id in HunterAhlquist.Solo.Shared HunterAhlquist.Solo.Extensibility; do
            dotnet nuget push "packages/${id}.${VERSION}.nupkg" \
              --api-key "${NUGET_API_KEY}" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

          {
            echo "### Contract ${VERSION} pushed to nuget.org"
            echo
            echo "- https://www.nuget.org/packages/HunterAhlquist.Solo.Shared/${VERSION}"
            echo "- https://www.nuget.org/packages/HunterAhlquist.Solo.Extensibility/${VERSION}"
            echo
            echo "nuget.org validates and indexes a new version before it can be restored, which takes a few minutes."
          } >> "$GITHUB_STEP_SUMMARY"

  # The templates, verified the same way: everything that can refuse the
  # release happens in a job that holds no credential.
  pack-templates:
    name: Verify and pack the templates
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref_name, 'templates-v')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the guard can see origin/main.
          fetch-depth: 0

      - name: Verify tagged commit is on main
        if: github.event_name == 'push'
        run: |
          if git merge-base --is-ancestor HEAD origin/main; then
            echo "Tag ${GITHUB_REF_NAME} is on main."
          else
            echo "::error::Tag ${GITHUB_REF_NAME} points at a commit that is not on main; refusing to publish."
            exit 1
          fi

      # The package takes its version from templates/Solo.Templates.csproj, so
      # the tag has to name that version.
      - name: Read the templates version
        id: version
        run: |
          set -euo pipefail

          version=$(sed -n 's/.*<Version>\(.*\)<\/Version>.*/\1/p' templates/Solo.Templates.csproj | head -1)
          if [ -z "${version}" ]; then
            echo "::error::No <Version> in templates/Solo.Templates.csproj."
            exit 1
          fi

          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            tagged="${GITHUB_REF_NAME#"${TEMPLATES_TAG_PREFIX}"}"
            if [ "${tagged}" != "${version}" ]; then
              echo "::error::Tag ${GITHUB_REF_NAME} names ${tagged}, but the templates are ${version}. Tag ${TEMPLATES_TAG_PREFIX}${version}, or bump the templates first."
              exit 1
            fi
          fi

          echo "Templates version ${version}."
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      # A generated project restores the contract from nuget.org, at the
      # version in build/contract-package.props. Templates published ahead of
      # that contract would scaffold projects that can't restore, so the
      # contract's `sdk-v*` tag goes first.
      - name: Verify the contract is on nuget.org
        if: github.event_name == 'push'
        run: |
          set -euo pipefail

          contract=$(sed -n 's/.*<Version>\(.*\)<\/Version>.*/\1/p' build/contract-package.props | head -1)
          for id in hunterahlquist.solo.shared hunterahlquist.solo.extensibility; do
            versions=$(curl -fsS "https://api.nuget.org/v3-flatcontainer/${id}/index.json" || true)
            if ! grep -q "\"${contract}\"" <<< "${versions}"; then
              echo "::error::${id} ${contract} is not on nuget.org. Publish the contract first (tag ${TAG_PREFIX}${contract})."
              exit 1
            fi
          done
          echo "Contract ${contract} is on nuget.org."

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      # The templates are verified against the contract in this checkout, which
      # the script below restores from artifacts/nuget.
      - name: Package the extension contract
        run: build/pack-contract.sh

      # Packs the templates into artifacts/templates, then generates an
      # extension for each combination of options and builds and packages it.
      - name: Package the extension templates
        run: build/pack-templates.sh

      - name: Upload the package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: templates-package
          path: artifacts/templates/HunterAhlquist.Solo.Templates.${{ steps.version.outputs.version }}.nupkg
          if-no-files-found: error
          retention-days: 7

  publish-templates:
    name: Publish the templates to nuget.org
    needs: pack-templates
    # Only a tag publishes; a manual run stops at the artifact.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # The same environment, and so the same approval, as the contract's publish.
    environment: nuget
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: templates-package
          path: packages

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Check the nuget.org user is set
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: |
          if [ -z "${NUGET_USER}" ]; then
            echo "::error::Set the NUGET_USER repository variable to the nuget.org profile name that owns the packages."
            exit 1
          fi

      - name: Log in to nuget.org
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
          VERSION: ${{ needs.pack-templates.outputs.version }}
        run: |
          set -euo pipefail

          dotnet nuget push "packages/HunterAhlquist.Solo.Templates.${VERSION}.nupkg" \
            --api-key "${NUGET_API_KEY}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

          {
            echo "### Templates ${VERSION} pushed to nuget.org"
            echo
            echo "- https://www.nuget.org/packages/HunterAhlquist.Solo.Templates/${VERSION}"
            echo
            echo "nuget.org validates and indexes a new version before \`dotnet new install\` can find it, which takes a few minutes."
          } >> "$GITHUB_STEP_SUMMARY"
