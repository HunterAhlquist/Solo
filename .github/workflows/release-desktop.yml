name: Desktop Release

on:
  push:
    tags: ["v*"]
  # Manual runs build the installers as workflow artifacts without touching
  # a release — useful for testing the packaging on a branch.
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            # One mac runner cross-builds both architectures.
            args: --x64 --arm64
          - os: windows-latest
            args: ""
          - os: ubuntu-latest
            args: ""
    defaults:
      run:
        working-directory: src/Solo.Desktop
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the tag guard below can see origin/main.
          fetch-depth: 0

      # Tags can point at any commit; only release ones that landed on main.
      - name: Verify tagged commit is on main
        if: github.event_name == 'push'
        run: |
          if git merge-base --is-ancestor HEAD origin/main; then
            echo "Tag ${GITHUB_REF_NAME} is on main."
          else
            echo "::error::Tag ${GITHUB_REF_NAME} points at a commit that is not on main; refusing to build."
            exit 1
          fi
        shell: bash

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Solo.Desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      # mac.icon is an Icon Composer bundle, staged by the beforePack hook and
      # compiled by electron-builder with actool, which only ships with Xcode
      # 26+. The image's default Xcode selection can lag behind what's
      # installed, and a newer actool means fewer icon features get dropped.
      - name: Select Xcode 26+
        if: runner.os == 'macOS'
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_2[6-9]*.app | sort -V | tail -1)"
          xcrun actool --version | grep short-bundle-version

      # Installer filenames come from package.json's version; keep them in
      # step with the tag. Tags that aren't valid semver (e.g. v1.2.0rc)
      # can't be stamped — those builds keep the committed version.
      - name: Stamp version from tag
        if: github.event_name == 'push'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! npm version "$VERSION" --no-git-tag-version; then
            echo "::warning::Tag ${GITHUB_REF_NAME} is not valid semver; keeping package.json version $(node -p "require('./package.json').version")"
          fi
        shell: bash

      - name: Publish Blazor client into shell
        run: npm run build:client

      # Without the signing/notarization secrets below, electron-builder
      # logs a warning and ships unsigned builds (mac users must
      # right-click → Open on first launch). Add the secrets and the same
      # workflow signs and notarizes with no other changes.
      - name: Package
        run: npx electron-builder --publish never ${{ matrix.args }}
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            src/Solo.Desktop/dist/*.dmg
            src/Solo.Desktop/dist/*.zip
            src/Solo.Desktop/dist/*.exe
            src/Solo.Desktop/dist/*.AppImage
          if-no-files-found: error

  release:
    name: Attach to GitHub release
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # For the artifact sweep below.
      actions: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # Creates the release for the tag if it doesn't exist yet; otherwise
      # attaches the installers to the existing one.
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true

      # The installers are ~725 MB a build and now live on the release, where
      # they cost nothing; as workflow artifacts they were only a handoff
      # between the matrix jobs and this one, and they bill against the
      # account's shared Actions/Packages storage. Deliberately not
      # `if: always()` — a failed upload must leave the artifacts behind, or
      # the build would have to be re-run to recover them.
      - name: Drop the hand-off artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
            --jq '.artifacts[] | select(.name | startswith("desktop-")) | "\(.id)\t\(.name)"' |
          while IFS=$'\t' read -r id name; do
            echo "Deleting $name ($id)"
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/$id"
          done
