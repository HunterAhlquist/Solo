name: Desktop Release

on:
  push:
    # One release series for the whole train: a `v*` tag runs ci.yml for the
    # server and the extension packages and this workflow for the installers,
    # and both attach to the one GitHub release for the tag. `preview-v*` is
    # the same train as a prerelease.
    tags: ["v*", "preview-v*"]
  # Manual runs build the installers as workflow artifacts without touching
  # a release — useful for testing the packaging on a branch.
  workflow_dispatch:

# Every job starts read-only. The few that publish (the image, the release)
# ask for exactly what they write, in their own permissions block.
permissions:
  contents: read

env:
  TAG_PREFIX: v

jobs:
  # Gate for the whole run. A tag that changes nothing the installers are built
  # from would package identical apps on three runners for several hundred MB
  # of upload, so it doesn't get built at all. Manual runs always fall through.
  changes:
    name: Check release inputs
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.diff.outputs.build }}
      previous: ${{ steps.diff.outputs.previous }}
      version: ${{ steps.channel.outputs.version }}
      prerelease: ${{ steps.channel.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the guard can see origin/main and the diff below
          # can reach earlier tags.
          fetch-depth: 0

      - name: Classify the release channel
        id: channel
        if: github.event_name == 'push'
        run: bash build/release-channel.sh "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

      # Stable tags must have landed on main; prereleases can test an unmerged branch.
      - name: Verify tagged commit is on main
        if: github.event_name == 'push' && steps.channel.outputs.prerelease != 'true'
        run: |
          if git merge-base --is-ancestor HEAD origin/main; then
            echo "Tag ${GITHUB_REF_NAME} is on main."
          else
            echo "::error::Tag ${GITHUB_REF_NAME} points at a commit that is not on main; refusing to build."
            exit 1
          fi

      - name: Diff against the previous release
        id: diff
        env:
          IS_PRERELEASE: ${{ steps.channel.outputs.prerelease }}
        run: |
          set -euo pipefail

          # Nearest earlier stable tag in this series that HEAD descends from.
          # The --exclude keeps the tag being pushed from matching itself; when a
          # second tag sits on the same commit the diff is correctly empty.
          # Resolved before the short-circuits below because the release job
          # needs it either way: it is where the updater feed and the desktop's
          # manifest entry are carried forward from when nothing was rebuilt.
          PREVIOUS=$(git describe --tags --abbrev=0 --match "${TAG_PREFIX}*" \
            --exclude "${GITHUB_REF_NAME}" --exclude "${TAG_PREFIX}*-*" HEAD 2>/dev/null || true)
          echo "previous=${PREVIOUS}" >> "$GITHUB_OUTPUT"

          if [ "${GITHUB_EVENT_NAME}" != "push" ] || [ "$IS_PRERELEASE" = "true" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Everything that ends up inside an installer: the shell itself, the
          # Blazor client it serves (plus the shared contracts that client
          # compiles against), and the icon source. Deliberately excludes
          # src/Solo.Api, src/Solo.Data, the Dockerfile, and docs — none of
          # them are packaged.
          PATHS=(
            src/Solo.Desktop
            src/Solo.Client
            src/Solo.Shared
            Icons
            .github/workflows/release-desktop.yml
          )

          if [ -z "${PREVIOUS}" ]; then
            echo "No earlier ${TAG_PREFIX}* tag in this history — building."
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --quiet "${PREVIOUS}" HEAD -- "${PATHS[@]}"; then
            echo "::notice::Nothing the installers are built from changed since ${PREVIOUS}; skipping the packaging run."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Changed since ${PREVIOUS}:"
            git diff --name-only "${PREVIOUS}" HEAD -- "${PATHS[@]}"
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ${{ matrix.os }}
    # A backstop, not a budget: before notarization had its own time limit a
    # slow Apple queue held the runner for as long as Apple took. A healthy
    # mac run is ~8 minutes plus however long notarization takes, which is
    # capped below.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Not macos-latest: that's macOS 26 with Xcode 26.6 at newest, and
          # actool 26.6 doesn't know the icon's `refractivity` feature, so
          # stage-icon.mjs drops it and the app ships the macOS 26 rendering.
          # `xcode-27` is the preview image (macOS 27 + Xcode 27), whose actool
          # compiles the feature. It is a preview: thinner capacity, and its
          # Xcode is a beta build that also signs and notarizes the release.
          # Move back to macos-latest once macOS 27 is the GA image.
          - os: xcode-27
            # Architecture comes from package.json's mac target: Apple silicon
            # only. Don't pass --x64/--arm64 here; an arch flag overrides the
            # config and adds an Intel build back. --dir stops at the signed
            # .app: it is notarized and stapled in its own step, and only then
            # wrapped in the .dmg (see "Build disk image").
            args: "--dir"
          - os: windows-latest
            args: ""
          - os: ubuntu-latest
            args: ""
    defaults:
      run:
        working-directory: src/Solo.Desktop
    # Lifted to the job because a step's `if:` can read the `env` context but
    # not `secrets` — the signing and notarizing steps skip themselves when
    # their secrets are absent.
    env:
      MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
      MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/Solo.Desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Electron 44 stopped fetching its binary on install and fetches it on
      # first launch instead — which would be the check below, whose
      # five-second wait for the debugger the download alone outlasts. The
      # packaging step brings its own copy, so only the mac runner needs it.
      - name: Fetch the Electron binary
        if: runner.os == 'macOS'
        run: node node_modules/electron/install.js

      - name: Verify glass loading view
        if: runner.os == 'macOS'
        run: npm run test:glass-loading

      # mac.icon is an Icon Composer bundle, staged by the beforePack hook and
      # compiled by electron-builder with actool, which only ships with Xcode
      # 26+. The image's default Xcode selection can lag behind what's
      # installed, and a newer actool means fewer icon features get dropped.
      - name: Select Xcode 26+
        if: runner.os == 'macOS'
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_2[6-9]*.app | sort -V | tail -1)"
          xcrun actool --version | grep short-bundle-version

      # The channel guard already validated this version; a failed stamp must
      # stop the build rather than publish mislabeled installers.
      - name: Stamp release identity
        env:
          RELEASE_VERSION: ${{ needs.changes.outputs.version || format('0.0.0-preview.{0}', github.run_number) }}
        run: |
          npm version "$RELEASE_VERSION" --no-git-tag-version --allow-same-version
          node -e 'console.log("DESKTOP_PRODUCT_NAME=" + require("./electron-builder.config.cjs").productName)' >> "$GITHUB_ENV"
        shell: bash

      - name: Verify desktop isolation
        run: |
          npm run test:app-identity
          npm run test:mac-network-identity
          npm run test:desktop-auth
          npm run test:instance-extensions
          npm run test:rotation-gesture

      - name: Publish Blazor client into shell
        run: npm run build:client

      # The macOS sign-in window (main/auth-sheet.js). Without it the app still
      # works but signs in through a browser tab, so a build that can't
      # compile or load it fails here rather than shipping that silently.
      - name: Build the macOS sign-in window
        if: runner.os == 'macOS'
        run: |
          npm run build:native
          node -e "const m = require('./native/auth-session/build/Release/auth_session.node'); if (typeof m.start !== 'function') process.exit(1)"

      # electron-builder builds its own signing keychain when CSC_LINK is set,
      # and that path is broken: it creates the keychain with a random password
      # but then calls `security set-key-partition-list -k` with the *p12
      # export* password (app-builder-lib importCerts). The two were never the
      # same secret; it only worked because a just-created keychain is already
      # unlocked, so the bogus password went unchecked. Since macos-latest
      # moved to macOS 27 the unlock happens unconditionally and the build dies
      # with "SecKeychainUnlock: The user name or passphrase you entered is not
      # correct."
      #
      # So we own the keychain instead. With CSC_LINK unset electron-builder
      # skips that code entirely and signs against CSC_KEYCHAIN.
      - name: Import signing certificate
        id: keychain
        if: runner.os == 'macOS' && env.MAC_CSC_LINK != ''
        run: |
          set -euo pipefail
          KEYCHAIN="${RUNNER_TEMP}/solo-signing.keychain-db"
          # Only ever unlocks this throwaway keychain, on a throwaway runner.
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          CERT="${RUNNER_TEMP}/mac-csc.p12"

          echo "$MAC_CSC_LINK" | base64 --decode > "$CERT"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # No auto-lock: a locked keychain is what broke the build in the
          # first place, and codesign runs unattended minutes later.
          security set-keychain-settings "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT" -k "$KEYCHAIN" -P "$MAC_CSC_KEY_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild
          # The keychain password, which is the one this actually wants.
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          # codesign resolves the certificate chain through the search list,
          # not through --keychain alone; keep the existing keychains on it.
          # `list-keychains` prints one indented, quoted path per line.
          EXISTING=()
          while IFS= read -r line; do
            EXISTING+=("$(printf '%s' "$line" | sed -e 's/^[[:space:]]*"//' -e 's/"$//')")
          done < <(security list-keychains -d user)
          # bash 3.2 (still /bin/bash on the runners) treats an empty array as
          # unbound under `set -u`, so don't expand one.
          if [ ${#EXISTING[@]} -gt 0 ]; then
            security list-keychains -d user -s "$KEYCHAIN" "${EXISTING[@]}"
          else
            security list-keychains -d user -s "$KEYCHAIN"
          fi

          rm -f "$CERT"
          # find-identity exits 0 even when it found nothing, so check the
          # count here rather than discovering it as an unsigned .dmg.
          security find-identity -v -p codesigning "$KEYCHAIN" \
            | tee "${RUNNER_TEMP}/identities"
          if grep -q "0 valid identities found" "${RUNNER_TEMP}/identities"; then
            echo "::error::No codesigning identity in the keychain — check that" \
                 "MAC_CSC_LINK is a base64 .p12 and MAC_CSC_KEY_PASSWORD matches it."
            exit 1
          fi
          echo "CSC_KEYCHAIN=${KEYCHAIN}" >> "$GITHUB_ENV"

      # Without the signing/notarization secrets, electron-builder logs a
      # warning and ships unsigned builds. Gatekeeper then blocks the first
      # launch on macOS, and since macOS 15 right-click → Open no longer gets
      # past it: users have to find Open Anyway in System Settings → Privacy &
      # Security. Add the secrets and the same workflow signs and notarizes
      # with no other changes.
      - name: Package
        run: npx electron-builder --config electron-builder.config.cjs --publish never ${{ matrix.args }}

      # Not electron-builder's `mac.notarize`: that waits on Apple inside the
      # Package step with no time limit and no output, so a slow notary queue
      # looked like a hung codesign and held the runner as long as Apple took.
      # Here the log carries the submission id and Apple's status as it goes,
      # and the wait is capped. The verdict is the final `status:` line of
      # submit's own output, not its exit status, which a timeout also
      # produces. It isn't asked for again with `notarytool info`: that is one
      # more authenticated call, able to fail a build Apple already accepted.
      - name: Notarize
        if: runner.os == 'macOS' && env.MAC_CSC_LINK != '' && env.APPLE_ID != ''
        env:
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          APP="dist/mac-arm64/${DESKTOP_PRODUCT_NAME}.app"
          ZIP="${RUNNER_TEMP}/Solo.zip"
          LOG="${RUNNER_TEMP}/notarytool.log"
          AUTH=(--apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID")

          ditto -c -k --sequesterRsrc --keepParent "$APP" "$ZIP"
          echo "Submitting $(du -h "$ZIP" | cut -f1) to the notary service."

          # Apple carries on processing after --timeout; this only stops
          # paying a runner to watch.
          xcrun notarytool submit "$ZIP" "${AUTH[@]}" --wait --timeout 40m 2>&1 | tee "$LOG" || true

          ID=$(awk '$1 == "id:" { print $2; exit }' "$LOG")
          if [ -z "$ID" ]; then
            echo "::error::The notary service returned no submission id; see notarytool's output above."
            exit 1
          fi
          # "Processing complete" is followed by `status: <verdict>`; a timeout
          # leaves no such line, or only "In Progress".
          STATUS=$(awk '/^ *status: / { sub(/^ *status: /, ""); s = $0 } END { print s }' "$LOG")
          case "$STATUS" in
            Accepted) ;;
            "" | "In Progress")
              echo "::error::Apple was still processing submission $ID after 40 minutes. It was not abandoned, but this build can't wait for it; re-run the job to submit again."
              exit 1 ;;
            *)
              xcrun notarytool log "$ID" "${AUTH[@]}" || true
              echo "::error::Notarization of submission $ID ended as '$STATUS'; Apple's log is above."
              exit 1 ;;
          esac

          xcrun stapler staple "$APP"
          # Gatekeeper's own verdict, from the stapled ticket alone.
          spctl -a -t exec -vv "$APP" 2>&1 | tee "${RUNNER_TEMP}/spctl.log"
          grep -q "source=Notarized Developer ID" "${RUNNER_TEMP}/spctl.log"

      # Wraps the finished, stapled app. --prepackaged skips packing and
      # signing entirely, so nothing touches the app after its ticket is
      # stapled; the afterAllArtifactBuild hook still re-encodes the image.
      - name: Build disk image
        if: runner.os == 'macOS'
        run: npx electron-builder --config electron-builder.config.cjs --mac --prepackaged "dist/mac-arm64/${DESKTOP_PRODUCT_NAME}.app" --publish never

      # The runner is ephemeral, but the keychain outlives the job on a
      # self-hosted one and leaving it on the search list breaks later builds.
      - name: Remove signing keychain
        if: always() && steps.keychain.outcome == 'success'
        run: security delete-keychain "${RUNNER_TEMP}/solo-signing.keychain-db"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.os }}
          path: |
            src/Solo.Desktop/dist/*.dmg
            src/Solo.Desktop/dist/*.exe
            src/Solo.Desktop/dist/*.AppImage
            src/Solo.Desktop/dist/*.zip
            src/Solo.Desktop/dist/*.blockmap
          if-no-files-found: error

  release:
    # ci.yml names the same group, so the two workflows never write this tag's
    # release — or merge into its manifest — at the same time.
    concurrency:
      group: github-release-${{ github.ref }}
      cancel-in-progress: false
    name: Attach to the GitHub release
    needs: [changes, build]
    # Runs on every tag push, including one whose installers were deliberately
    # not rebuilt. electron-updater refuses to look past the newest release, so
    # that release has to carry a channel file whether or not this train built
    # one — otherwise an app checking for updates gets a 404 until the next
    # desktop change. A failed build carries the last good feed forward for the
    # same reason; the run still reports the failure.
    if: always() && github.event_name == 'push' && needs.changes.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # For the artifact sweep below.
      actions: write
    env:
      TAG: ${{ github.ref_name }}
      PREVIOUS: ${{ needs.changes.outputs.previous }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # For build/updater-feed.mjs and build/release-manifest.mjs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.build.result == 'success'
        with:
          path: artifacts
          merge-multiple: true

      # The channel files electron-updater reads, pointing at the installers
      # this run is about to attach. Their URLs are absolute, which is why the
      # app is configured with the `generic` provider: the GitHub provider
      # rebuilds every URL from the tag it found the feed on, and this train
      # deliberately leaves installers in the release that built them.
      - name: Write the updater feed
        id: written
        if: needs.build.result == 'success'
        # Reported as a failure by the last step in this job, not here: the
        # steps in between are what keep this release's update checks working,
        # and they have to run before the job gives up.
        continue-on-error: true
        env:
          VERSION: ${{ needs.changes.outputs.version }}
        run: |
          node build/updater-feed.mjs --dist artifacts --out artifacts \
            --version "$VERSION" --tag "$TAG" \
            --base "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${TAG}/"

      # The manifest already on this release if ci.yml got here first, else the
      # previous release's. A component this train did not rebuild keeps its
      # entry, so the newest release's manifest still describes all of it.
      # `!cancelled()` rather than the default gating: if the feed above failed,
      # the steps that keep this release usable still have to run, and the job
      # still reports the failure at the end.
      - name: Resolve the baseline manifest
        id: baseline
        run: |
          set -euo pipefail
          path=$(bash build/release-baseline.sh "$TAG" "$PREVIOUS" baseline)
          echo "path=${path}" >> "$GITHUB_OUTPUT"

      # The invariant this whole design rests on: the newest release always
      # carries a channel file. electron-updater reads only the newest release
      # and treats a missing one as an error, not as "no update", so a release
      # without it breaks every installed app's update check until the next
      # desktop build.
      #
      # Keyed on whether a feed is actually present rather than on the build
      # job's result, because there are two ways to arrive here without one: the
      # installers were deliberately not rebuilt, or building the feed failed.
      # Gating on the build job would cover only the first and leave the second
      # publishing a release with no feed at all.
      #
      # Carrying it forward is a copy of three small files: every URL in them is
      # absolute and already points at the release holding the matching
      # installers, so no installer is uploaded twice.
      - name: Ensure the release carries an updater feed
        env:
          BASELINE: ${{ steps.baseline.outputs.path }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          shopt -s nullglob

          fresh=(artifacts/latest*.yml)
          if [ ${#fresh[@]} -gt 0 ]; then
            echo "Built in this release: ${fresh[*]}"
            exit 0
          fi

          # Anything built but not described by a feed this run produced is
          # undescribed by the manifest too, and a release must not offer an
          # installer nothing vouches for. Reachable only when the feed write
          # itself failed; a train that simply skipped the build has none.
          undescribed=(artifacts/*.dmg artifacts/*.zip artifacts/*.exe artifacts/*.AppImage artifacts/*.blockmap)
          if [ ${#undescribed[@]} -gt 0 ]; then
            echo "::warning::Discarding installers no updater feed describes: ${undescribed[*]}"
            rm -f "${undescribed[@]}"
          fi

          if [ -n "$PREVIOUS" ] && gh release download "$PREVIOUS" -p 'latest*.yml' -D artifacts 2>/dev/null; then
            echo "Carried forward from $PREVIOUS:"
            for feed in artifacts/latest*.yml; do
              echo "--- $feed"
              cat "$feed"
            done
            exit 0
          fi

          # Nothing to carry forward. Fatal once a desktop app has been
          # released, because its installs are reading this file; before the
          # first one there is nothing out there to break. The baseline is
          # trustworthy here: release-baseline.sh refuses to report an
          # unreadable release as an absent one, and a failure there stops this
          # job before it reaches this point.
          if [ -n "$BASELINE" ] && [ -f "$BASELINE" ] && \
             node -e 'process.exit(JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).desktop ? 0 : 1)' "$BASELINE"; then
            echo "::error::This release has no updater feed, and ${PREVIOUS:-no previous release} has none to carry forward," \
                 "while a desktop app whose update checks read it has already shipped." \
                 "Refusing to publish a release that breaks them — re-run the desktop build."
            exit 1
          fi
          echo "::warning::No updater feed on this release and no earlier desktop release to carry one forward from."

      # The client bundled in the installers is what soloClientVersion is
      # checked against, so the contract version rides along with the desktop
      # entry: an extension updater can tell whether a newer package's pages
      # would load in this build of the app. Conditional on the fragment rather
      # than on the build job, which is the actual precondition.
      - name: Describe the desktop
        run: |
          set -euo pipefail
          if [ ! -f artifacts/desktop-manifest.json ]; then
            echo "No desktop entry to record: no installers were built into this release."
            exit 0
          fi
          contract=$(sed -n 's/.*<Version>\(.*\)<\/Version>.*/\1/p' build/contract-package.props | head -1)
          node -e '
            const fs = require("fs");
            const fragment = JSON.parse(fs.readFileSync("artifacts/desktop-manifest.json", "utf8"));
            fragment.desktop.contract = process.argv[1];
            fs.writeFileSync("desktop.json", JSON.stringify(fragment, null, 2));
          ' "$contract"
          cat desktop.json
          # Not a release asset: the manifest carries this.
          rm artifacts/desktop-manifest.json

      - name: Assemble the release manifest
        env:
          VERSION: ${{ needs.changes.outputs.version }}
          PRERELEASE: ${{ needs.changes.outputs.prerelease }}
          BASELINE: ${{ steps.baseline.outputs.path }}
        run: |
          set -euo pipefail
          args=(--out release-manifest.json --tag "$TAG" --version "$VERSION" --prerelease "$PRERELEASE")
          if [ -n "$BASELINE" ]; then args+=(--baseline "$BASELINE"); fi
          if [ -f desktop.json ]; then args+=(--fragment desktop.json); fi
          node build/release-manifest.mjs "${args[@]}"

      # Creates the release for the tag if it doesn't exist yet; otherwise adds
      # to the one ci.yml created.
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            release-manifest.json
            artifacts/*
          # A build that failed with no earlier feed to carry forward leaves
          # artifacts/ empty; the manifest still has to reach the release.
          fail_on_unmatched_files: false
          generate_release_notes: true
          prerelease: ${{ needs.changes.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.changes.outputs.prerelease == 'true' && 'false' || 'legacy' }}

      # The installers are hundreds of MB a build and now live on the release,
      # where they cost nothing; as workflow artifacts they were only a handoff
      # between the matrix jobs and this one, and they bill against the
      # account's shared Actions/Packages storage. Deliberately not
      # `if: always()` — a failed upload must leave the artifacts behind, or
      # the build would have to be re-run to recover them.
      - name: Drop the hand-off artifacts
        if: needs.build.result == 'success' && steps.written.outcome == 'success'
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
            --jq '.artifacts[] | select(.name | startswith("desktop-")) | "\(.id)\t\(.name)"' |
          while IFS=$'\t' read -r id name; do
            echo "Deleting $name ($id)"
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/$id"
          done

      # The failure deferred above, once the release is consistent again: it
      # carries the previous feed and a manifest that matches it, and the
      # installers this run could not describe were discarded. Last in the job
      # so everything that keeps the release usable has already run.
      - name: Report a failed updater feed
        if: always() && steps.written.outcome == 'failure'
        run: |
          echo "::error::Building this release's updater feed failed. The release kept the previous" \
               "feed, so installed apps still resolve to the last good installers, and this release's" \
               "own installers were not attached. Fix the cause and re-run."
          exit 1
