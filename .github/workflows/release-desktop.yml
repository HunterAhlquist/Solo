name: Desktop Release

on:
  push:
    # One release series for the whole train: a `v*` tag runs ci.yml for the
    # server and the extension packages and this workflow for the installers,
    # and both attach to the one GitHub release for the tag. `preview-v*` is
    # the same train as a prerelease.
    tags: ["v*", "preview-v*"]
  # Manual runs build the installers, and the Mac app, as workflow artifacts
  # without touching a release — useful for testing the packaging on a branch.
  workflow_dispatch:

# Every job starts read-only. The few that publish (the image, the release)
# ask for exactly what they write, in their own permissions block.
permissions:
  contents: read

env:
  TAG_PREFIX: v

jobs:
  # Gate for the whole run. A tag that changes nothing the installers are built
  # from would package identical apps on two runners for several hundred MB
  # of upload, so it doesn't get built at all. Manual runs always fall through.
  changes:
    name: Check release inputs
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.diff.outputs.build }}
      previous: ${{ steps.diff.outputs.previous }}
      version: ${{ steps.channel.outputs.version }}
      prerelease: ${{ steps.channel.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the guard can see origin/main and the diff below
          # can reach earlier tags.
          fetch-depth: 0

      - name: Classify the release channel
        id: channel
        if: github.event_name == 'push'
        run: bash build/release-channel.sh "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

      # Stable tags must have landed on main; prereleases can test an unmerged branch.
      - name: Verify tagged commit is on main
        if: github.event_name == 'push' && steps.channel.outputs.prerelease != 'true'
        run: |
          if git merge-base --is-ancestor HEAD origin/main; then
            echo "Tag ${GITHUB_REF_NAME} is on main."
          else
            echo "::error::Tag ${GITHUB_REF_NAME} points at a commit that is not on main; refusing to build."
            exit 1
          fi

      - name: Diff against the previous release
        id: diff
        env:
          IS_PRERELEASE: ${{ steps.channel.outputs.prerelease }}
        run: |
          set -euo pipefail

          # Nearest earlier stable tag in this series that HEAD descends from.
          # The --exclude keeps the tag being pushed from matching itself; when a
          # second tag sits on the same commit the diff is correctly empty.
          # Resolved before the short-circuits below because the release job
          # needs it either way: it is where the updater feed and the desktop's
          # manifest entry are carried forward from when nothing was rebuilt.
          PREVIOUS=$(git describe --tags --abbrev=0 --match "${TAG_PREFIX}*" \
            --exclude "${GITHUB_REF_NAME}" --exclude "${TAG_PREFIX}*-*" HEAD 2>/dev/null || true)
          echo "previous=${PREVIOUS}" >> "$GITHUB_OUTPUT"

          if [ "${GITHUB_EVENT_NAME}" != "push" ] || [ "$IS_PRERELEASE" = "true" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Everything that ends up inside an installer: the shell itself, the
          # Blazor client it serves (plus the shared contracts that client
          # compiles against), and the icon source. Deliberately excludes
          # src/Solo.Api, src/Solo.Data, the Dockerfile, and docs — none of
          # them are packaged.
          PATHS=(
            src/Solo.Desktop
            src/Solo.Client
            src/Solo.Shared
            Icons
            .github/workflows/release-desktop.yml
          )

          if [ -z "${PREVIOUS}" ]; then
            echo "No earlier ${TAG_PREFIX}* tag in this history — building."
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --quiet "${PREVIOUS}" HEAD -- "${PATHS[@]}"; then
            echo "::notice::Nothing the installers are built from changed since ${PREVIOUS}; skipping the packaging run."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Changed since ${PREVIOUS}:"
            git diff --name-only "${PREVIOUS}" HEAD -- "${PATHS[@]}"
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ${{ matrix.os }}
    # A backstop, not a budget: packaging takes minutes.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Windows and Linux. The shell is no longer built for macOS: a Mac is
        # left to the native app (src/Solo.iOS), which the `mac` job below
        # builds for this release and release-mac-store.yml for TestFlight.
        # package.json keeps its mac target, so the shell still builds for one
        # locally; and the release job below still hands the last macOS feed
        # on, for the copies already installed.
        os: [windows-latest, ubuntu-latest]
    defaults:
      run:
        working-directory: src/Solo.Desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/Solo.Desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The channel guard already validated this version; a failed stamp must
      # stop the build rather than publish mislabeled installers.
      - name: Stamp release identity
        env:
          RELEASE_VERSION: ${{ needs.changes.outputs.version || format('0.0.0-preview.{0}', github.run_number) }}
        run: npm version "$RELEASE_VERSION" --no-git-tag-version --allow-same-version
        shell: bash

      - name: Verify desktop isolation
        run: |
          npm run test:app-identity
          npm run test:host-guard
          npm run test:mac-network-identity
          npm run test:desktop-auth
          npm run test:instance-extensions
          npm run test:rotation-gesture
          npm run test:updater
          npm run test:update-progress

      - name: Publish Blazor client into shell
        run: npm run build:client

      - name: Package
        run: npx electron-builder --config electron-builder.config.cjs --publish never

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.os }}
          path: |
            src/Solo.Desktop/dist/*.exe
            src/Solo.Desktop/dist/*.AppImage
            src/Solo.Desktop/dist/*.blockmap
          if-no-files-found: error

  # The Mac download: the native app (src/Solo.iOS), signed with the Developer
  # ID certificate and notarized, in a disk image. It is the same target
  # release-mac-store.yml uploads to TestFlight, signed differently: that
  # build is the store's and opens only through it, and this one is for anyone
  # who downloads it. It is built for every tag rather than only when the app
  # changed: nothing points from one release at another's image, as the
  # updater feeds do for the installers, so a release without one would have
  # no Mac download at all.
  #
  # It is not the shell and is in none of the shell's feeds: an installed
  # Electron copy reads latest-mac.yml, which goes on naming the last Electron
  # build (see "Carry the last macOS feed forward"). The image is handed to the
  # release job under its own artifact name and kept out of the folder the
  # feeds are written from, where build/updater-feed.mjs would take any .dmg
  # for the shell's.
  mac:
    name: Build the Mac app
    needs: changes
    # The Xcode 27 image, as for the TestFlight uploads: it is what the app is
    # built and tested with. A release Xcode is picked below.
    runs-on: xcode-27
    # A backstop, not a budget: the build is a few minutes and each of the two
    # notarizations is capped by the packaging script.
    timeout-minutes: 90
    outputs:
      built: ${{ steps.gate.outputs.build }}
    # No secret is set for the whole job. The archive step builds other
    # people's packages, so the certificate and the notary's credentials — the
    # ones the shell's Mac build was signed and notarized with — are handed
    # only to the steps that use them, and the step that asks whether they are
    # there is told yes or no, not what they are.
    defaults:
      run:
        working-directory: src/Solo.iOS
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # All or nothing. Unsigned, or signed and not notarized, the app is one
      # Gatekeeper turns away, and since macOS 15 there is no way past that
      # short of System Settings: a release is better without a Mac download
      # than with that one.
      - name: Check the signing secrets
        id: gate
        working-directory: .
        env:
          HAVE_ALL: ${{ secrets.MAC_CSC_LINK != '' && secrets.MAC_CSC_KEY_PASSWORD != '' && secrets.APPLE_ID != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
        run: |
          set -euo pipefail
          if [ "$HAVE_ALL" != true ]; then
            echo "::notice::The Developer ID certificate or the notarization credentials aren't set; this release gets no Mac download."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      # The newest release (non-beta) Xcode 27 on the image, as for TestFlight:
      # one toolchain builds every copy of the app that leaves here.
      - name: Select Xcode 27
        if: steps.gate.outputs.build == 'true'
        run: |
          set -euo pipefail
          sudo xcode-select -s "$(ls -d /Applications/Xcode_27*.app | grep -v -i beta | sort -V | tail -1)"
          xcodebuild -version

      # Which app the build is made as, by the rule the installers go by
      # (main/app-identity.js): a version with a prerelease suffix is the
      # preview, and so is a manual run. The preview is the TestFlight
      # preview's app — its bundle id, name and icon — so the two are one app
      # that came by two roads, and share what they keep. The release is the
      # project as it stands: its own bundle id, name and icon, with nothing
      # said on the command line. `asset` has no space in it, which GitHub
      # would rewrite to a dot.
      - name: Choose the app
        id: app
        if: steps.gate.outputs.build == 'true'
        working-directory: .
        env:
          VERSION: ${{ needs.changes.outputs.version || format('0.0.0-preview.{0}', github.run_number) }}
          PRERELEASE: ${{ needs.changes.outputs.prerelease }}
        run: |
          set -euo pipefail
          if [ "$PRERELEASE" = false ]; then
            { echo "bundle_id="; echo "name="; echo "icon="; echo "installed=Solo"
              echo "asset=Solo-$VERSION-mac.dmg"; } >> "$GITHUB_OUTPUT"
          else
            { echo "bundle_id=com.hunterahlquist.solo.preview"; echo "name=Solo (Preview)"; echo "icon=Solo Preview"
              echo "installed=Solo (Preview)"; echo "asset=Solo-Preview-$VERSION-mac.dmg"; } >> "$GITHUB_OUTPUT"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # The project keeps the release's icon (Solo/Solo.icon). The preview's is
      # in Icons with the desktop's; the app's folder is one the project reads
      # whole, so a file put in it is in the target without being listed.
      - name: Stage the preview icon
        if: steps.gate.outputs.build == 'true' && steps.app.outputs.icon != ''
        run: cp -R "../../Icons/Solo Preview.icon" "Solo/Solo Preview.icon"

      # Signed for nobody here, as for the store's build: the signature that
      # matters is put on by build/package-mac-direct.sh, where an identity
      # given on this command line would be handed to the packages too. The
      # bundle id goes through SOLO_BUNDLE_ID (see release-ios.yml for why).
      # The marketing version drops the prerelease suffix, which a bundle
      # can't carry; the build number is the minute of the build, in UTC.
      - name: Archive
        if: steps.gate.outputs.build == 'true'
        env:
          VERSION: ${{ steps.app.outputs.version }}
          BUNDLE_ID: ${{ steps.app.outputs.bundle_id }}
          APP_NAME: ${{ steps.app.outputs.name }}
          APP_ICON: ${{ steps.app.outputs.icon }}
        run: |
          set -euo pipefail
          # Said only for the preview: the release's are the project's own.
          identity=()
          [ -z "$BUNDLE_ID" ] || identity+=("SOLO_BUNDLE_ID=$BUNDLE_ID")
          [ -z "$APP_NAME" ] || identity+=("INFOPLIST_KEY_CFBundleDisplayName=$APP_NAME")
          [ -z "$APP_ICON" ] || identity+=("ASSETCATALOG_COMPILER_APPICON_NAME=$APP_ICON")
          xcodebuild archive \
            -project Solo.xcodeproj -scheme Solo -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$RUNNER_TEMP/Solo.xcarchive" \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
            MARKETING_VERSION="${VERSION%%-*}" \
            CURRENT_PROJECT_VERSION="$(date -u +%Y%m%d%H%M)" \
            ${identity[@]+"${identity[@]}"}

      # A keychain of the job's own, so the identity is gone with it and
      # nothing is left in the runner's login keychain.
      - name: Import signing certificate
        id: keychain
        if: steps.gate.outputs.build == 'true'
        env:
          # The Developer ID Application certificate, as a base64 .p12.
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="${RUNNER_TEMP}/solo-signing.keychain-db"
          # Only ever unlocks this throwaway keychain, on a throwaway runner.
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          CERT="${RUNNER_TEMP}/mac-csc.p12"

          echo "$MAC_CSC_LINK" | base64 --decode > "$CERT"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # No auto-lock: codesign runs unattended, and again after each wait
          # on the notary service.
          security set-keychain-settings "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT" -k "$KEYCHAIN" -P "$MAC_CSC_KEY_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          # codesign resolves the certificate chain through the search list,
          # not through --keychain alone; keep the existing keychains on it.
          # `list-keychains` prints one indented, quoted path per line.
          EXISTING=()
          while IFS= read -r line; do
            EXISTING+=("$(printf '%s' "$line" | sed -e 's/^[[:space:]]*"//' -e 's/"$//')")
          done < <(security list-keychains -d user)
          # bash 3.2 (still /bin/bash on the runners) treats an empty array as
          # unbound under `set -u`, so don't expand one.
          if [ ${#EXISTING[@]} -gt 0 ]; then
            security list-keychains -d user -s "$KEYCHAIN" "${EXISTING[@]}"
          else
            security list-keychains -d user -s "$KEYCHAIN"
          fi
          rm -f "$CERT"

          # find-identity exits 0 even when it found nothing, so the identity
          # is looked for here rather than discovered as a failed signature.
          security find-identity -v -p codesigning "$KEYCHAIN" | tee "${RUNNER_TEMP}/identities"
          grep -q "Developer ID Application" "${RUNNER_TEMP}/identities" || {
            echo "::error::MAC_CSC_LINK has no Developer ID Application identity — check that it is a base64 .p12 and that MAC_CSC_KEY_PASSWORD matches it."; exit 1; }

      # Signs the archived app, has Apple notarize it, and wraps it in the
      # image; then does the same for the image. Each wait on Apple is capped
      # in the script, which says what Apple answered as it goes.
      - name: Package
        if: steps.gate.outputs.build == 'true'
        working-directory: .
        env:
          INSTALLED: ${{ steps.app.outputs.installed }}
          ASSET: ${{ steps.app.outputs.asset }}
          # What the script notarizes with.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash build/package-mac-direct.sh "$RUNNER_TEMP/Solo.xcarchive" "$RUNNER_TEMP/mac/$ASSET" "$INSTALLED"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.gate.outputs.build == 'true'
        with:
          # Not `desktop-…`: the release job takes those into the folder its
          # updater feeds are written from.
          name: native-mac
          path: ${{ runner.temp }}/mac/*.dmg
          if-no-files-found: error

      # The runner is ephemeral, but the keychain outlives the job on a
      # self-hosted one and leaving it on the search list breaks later builds.
      - name: Remove signing keychain
        if: always() && steps.keychain.outcome == 'success'
        run: security delete-keychain "${RUNNER_TEMP}/solo-signing.keychain-db"

  release:
    # ci.yml names the same group, so the two workflows never write this tag's
    # release — or merge into its manifest — at the same time.
    concurrency:
      group: github-release-${{ github.ref }}
      cancel-in-progress: false
    name: Attach to the GitHub release
    needs: [changes, build, mac]
    # Runs on every tag push, including one whose installers were deliberately
    # not rebuilt. electron-updater refuses to look past the newest release, so
    # that release has to carry a channel file whether or not this train built
    # one — otherwise an app checking for updates gets a 404 until the next
    # desktop change. A failed build carries the last good feed forward for the
    # same reason; the run still reports the failure. A failed Mac build is
    # waited for and then done without: the release goes out with no Mac
    # download, and that job is what reports it.
    if: always() && github.event_name == 'push' && needs.changes.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # For the artifact sweep below.
      actions: write
    env:
      TAG: ${{ github.ref_name }}
      PREVIOUS: ${{ needs.changes.outputs.previous }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # For build/updater-feed.mjs and build/release-manifest.mjs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.build.result == 'success'
        with:
          # The installers only. The Mac app's image is not one of them, and in
          # this folder the feed below would be written as if it were.
          pattern: desktop-*
          path: artifacts
          merge-multiple: true

      # The native Mac app's image, into a folder of its own: it is attached
      # to the release and is in no feed. Asked for only when that job got as
      # far as handing one over: it says it is building before it has built,
      # and an image that isn't there would stop this job short of the release.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.mac.result == 'success' && needs.mac.outputs.built == 'true'
        with:
          name: native-mac
          path: mac

      # The channel files electron-updater reads, pointing at the installers
      # this run is about to attach. Their URLs are absolute, which is why the
      # app is configured with the `generic` provider: the GitHub provider
      # rebuilds every URL from the tag it found the feed on, and this train
      # deliberately leaves installers in the release that built them.
      - name: Write the updater feed
        id: written
        if: needs.build.result == 'success'
        # Reported as a failure by the last step in this job, not here: the
        # steps in between are what keep this release's update checks working,
        # and they have to run before the job gives up.
        continue-on-error: true
        env:
          VERSION: ${{ needs.changes.outputs.version }}
        run: |
          node build/updater-feed.mjs --dist artifacts --out artifacts \
            --version "$VERSION" --tag "$TAG" \
            --base "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${TAG}/"

      # The manifest already on this release if ci.yml got here first, else the
      # previous release's. A component this train did not rebuild keeps its
      # entry, so the newest release's manifest still describes all of it.
      # `!cancelled()` rather than the default gating: if the feed above failed,
      # the steps that keep this release usable still have to run, and the job
      # still reports the failure at the end.
      - name: Resolve the baseline manifest
        id: baseline
        run: |
          set -euo pipefail
          path=$(bash build/release-baseline.sh "$TAG" "$PREVIOUS" baseline)
          echo "path=${path}" >> "$GITHUB_OUTPUT"

      # The invariant this whole design rests on: the newest release always
      # carries a channel file. electron-updater reads only the newest release
      # and treats a missing one as an error, not as "no update", so a release
      # without it breaks every installed app's update check until the next
      # desktop build.
      #
      # Keyed on whether a feed is actually present rather than on the build
      # job's result, because there are two ways to arrive here without one: the
      # installers were deliberately not rebuilt, or building the feed failed.
      # Gating on the build job would cover only the first and leave the second
      # publishing a release with no feed at all.
      #
      # Carrying it forward is a copy of three small files: every URL in them is
      # absolute and already points at the release holding the matching
      # installers, so no installer is uploaded twice.
      - name: Ensure the release carries an updater feed
        env:
          BASELINE: ${{ steps.baseline.outputs.path }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          shopt -s nullglob

          fresh=(artifacts/latest*.yml)
          if [ ${#fresh[@]} -gt 0 ]; then
            echo "Built in this release: ${fresh[*]}"
            exit 0
          fi

          # Anything built but not described by a feed this run produced is
          # undescribed by the manifest too, and a release must not offer an
          # installer nothing vouches for. Reachable only when the feed write
          # itself failed; a train that simply skipped the build has none.
          undescribed=(artifacts/*.exe artifacts/*.AppImage artifacts/*.blockmap)
          if [ ${#undescribed[@]} -gt 0 ]; then
            echo "::warning::Discarding installers no updater feed describes: ${undescribed[*]}"
            rm -f "${undescribed[@]}"
          fi

          if [ -n "$PREVIOUS" ] && gh release download "$PREVIOUS" -p 'latest*.yml' -D artifacts 2>/dev/null; then
            echo "Carried forward from $PREVIOUS:"
            for feed in artifacts/latest*.yml; do
              echo "--- $feed"
              cat "$feed"
            done
            exit 0
          fi

          # Nothing to carry forward. Fatal once a desktop app has been
          # released, because its installs are reading this file; before the
          # first one there is nothing out there to break. The baseline is
          # trustworthy here: release-baseline.sh refuses to report an
          # unreadable release as an absent one, and a failure there stops this
          # job before it reaches this point.
          if [ -n "$BASELINE" ] && [ -f "$BASELINE" ] && \
             node -e 'process.exit(JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).desktop ? 0 : 1)' "$BASELINE"; then
            echo "::error::This release has no updater feed, and ${PREVIOUS:-no previous release} has none to carry forward," \
                 "while a desktop app whose update checks read it has already shipped." \
                 "Refusing to publish a release that breaks them — re-run the desktop build."
            exit 1
          fi
          echo "::warning::No updater feed on this release and no earlier desktop release to carry one forward from."

      # macOS is no longer built here (see the build matrix), but the shell is
      # installed on Macs that go on reading latest-mac.yml off the newest
      # release, and to them a 404 is a broken update check, not "no update". So
      # the last one written is handed from release to release: every URL in it
      # is absolute and names the last macOS build, in the release that still
      # holds it. A previous release whose assets can't be listed stops the job,
      # as an unreadable baseline does; one that has no such file has nothing to
      # hand on.
      - name: Carry the last macOS feed forward
        run: |
          set -euo pipefail
          if [ -f artifacts/latest-mac.yml ]; then
            echo "Already here: carried forward with the rest of the feed."
            exit 0
          fi
          if [ -z "$PREVIOUS" ]; then
            echo "No earlier release to carry a macOS feed forward from."
            exit 0
          fi
          assets=$(gh release view "$PREVIOUS" --json assets --jq '.assets[].name')
          if ! grep -qxF latest-mac.yml <<< "$assets"; then
            echo "$PREVIOUS has no latest-mac.yml to carry forward."
            exit 0
          fi
          gh release download "$PREVIOUS" -p latest-mac.yml -D artifacts
          echo "Carried forward from $PREVIOUS:"
          cat artifacts/latest-mac.yml

      # The client bundled in the installers is what soloClientVersion is
      # checked against, so the contract version rides along with the desktop
      # entry: an extension updater can tell whether a newer package's pages
      # would load in this build of the app. Conditional on the fragment rather
      # than on the build job, which is the actual precondition.
      - name: Describe the desktop
        run: |
          set -euo pipefail
          if [ ! -f artifacts/desktop-manifest.json ]; then
            echo "No desktop entry to record: no installers were built into this release."
            exit 0
          fi
          contract=$(sed -n 's/.*<Version>\(.*\)<\/Version>.*/\1/p' build/contract-package.props | head -1)
          node -e '
            const fs = require("fs");
            const fragment = JSON.parse(fs.readFileSync("artifacts/desktop-manifest.json", "utf8"));
            fragment.desktop.contract = process.argv[1];
            fs.writeFileSync("desktop.json", JSON.stringify(fragment, null, 2));
          ' "$contract"
          cat desktop.json
          # Not a release asset: the manifest carries this.
          rm artifacts/desktop-manifest.json

      - name: Assemble the release manifest
        env:
          VERSION: ${{ needs.changes.outputs.version }}
          PRERELEASE: ${{ needs.changes.outputs.prerelease }}
          BASELINE: ${{ steps.baseline.outputs.path }}
        run: |
          set -euo pipefail
          args=(--out release-manifest.json --tag "$TAG" --version "$VERSION" --prerelease "$PRERELEASE")
          if [ -n "$BASELINE" ]; then args+=(--baseline "$BASELINE"); fi
          if [ -f desktop.json ]; then args+=(--fragment desktop.json); fi
          node build/release-manifest.mjs "${args[@]}"

      # The release's notes are CHANGELOG.md's Latest section, read from the
      # tagged checkout so both workflows write the same text; the next change
      # dates it (build/changelog.sh sync). A tag with no section
      # gets GitHub's generated list rather than a blank release, generated
      # here rather than by the upload action because the action generates it
      # on every update too, which is what doubled the notes on past releases.
      - name: Read the release notes
        run: |
          if bash build/changelog.sh notes > release-notes.md; then
            exit 0
          fi
          echo "::warning::CHANGELOG.md has no Latest section; the release gets GitHub's generated notes."
          gh api -X POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$TAG" ${PREVIOUS:+-f previous_tag_name="$PREVIOUS"} \
            --jq .body > release-notes.md

      # Creates the release for the tag if it doesn't exist yet; otherwise adds
      # to the one ci.yml created.
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            release-manifest.json
            artifacts/*
            mac/*
          # A build that failed with no earlier feed to carry forward leaves
          # artifacts/ empty; the manifest still has to reach the release.
          fail_on_unmatched_files: false
          body_path: release-notes.md
          prerelease: ${{ needs.changes.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.changes.outputs.prerelease == 'true' && 'false' || 'legacy' }}

      # One prerelease at a time: the ones tagged before this one are taken off
      # the releases page (build/prune-prereleases.sh). After the upload, so it
      # is only done once this tag's release is there to take their place; in
      # both workflows, since either may be the one that finishes; and never a
      # failure of this job. A stable release removes nothing.
      - name: Remove earlier prereleases
        env:
          PRERELEASE: ${{ needs.changes.outputs.prerelease }}
        run: bash build/prune-prereleases.sh "$TAG" "$PRERELEASE"

      # The installers are hundreds of MB a build and now live on the release,
      # where they cost nothing; as workflow artifacts they were only a handoff
      # between the matrix jobs and this one, and they bill against the
      # account's shared Actions/Packages storage. Deliberately not
      # `if: always()` — a failed upload must leave the artifacts behind, or
      # the build would have to be re-run to recover them.
      - name: Drop the hand-off artifacts
        if: needs.build.result == 'success' && steps.written.outcome == 'success'
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
            --jq '.artifacts[] | select(.name | startswith("desktop-")) | "\(.id)\t\(.name)"' |
          while IFS=$'\t' read -r id name; do
            echo "Deleting $name ($id)"
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/$id"
          done

      # The Mac app's image likewise, once it is on the release.
      - name: Drop the Mac hand-off artifact
        if: needs.mac.result == 'success' && needs.mac.outputs.built == 'true'
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
            --jq '.artifacts[] | select(.name == "native-mac") | .id' |
          while read -r id; do
            echo "Deleting native-mac ($id)"
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/$id"
          done

      # The failure deferred above, once the release is consistent again: it
      # carries the previous feed and a manifest that matches it, and the
      # installers this run could not describe were discarded. Last in the job
      # so everything that keeps the release usable has already run.
      - name: Report a failed updater feed
        if: always() && steps.written.outcome == 'failure'
        run: |
          echo "::error::Building this release's updater feed failed. The release kept the previous" \
               "feed, so installed apps still resolve to the last good installers, and this release's" \
               "own installers were not attached. Fix the cause and re-run."
          exit 1
