name: iOS TestFlight

on:
  push:
    # A `preview-v*` tag uploads the iPad and iPhone app to the preview app's
    # TestFlight ("Solo (Preview)"), and a version tag (`v*`) to the store
    # app's ("Solo"), which is the one SOLO_ASC_APP_ID names. Both are for
    # internal testers: nothing here reaches external testers or App Review.
    tags: ["preview-v*", "v*"]
  # Builds and uploads from a branch, under a preview version, without a tag.
  workflow_dispatch:

permissions:
  contents: read
  # build/testflight-gate.sh reads this workflow's earlier runs to find the
  # last build that reached TestFlight.
  actions: read

jobs:
  testflight:
    name: Upload to TestFlight
    # The Xcode 27 image, which is what the app is built and tested with: it
    # deploys to iOS 26 and draws with what that SDK brought. App Store Connect
    # turns away beta toolchains, so the step below picks a release Xcode.
    runs-on: xcode-27
    timeout-minutes: 45
    # The App Store Connect key can publish builds, so it lives in an
    # environment whose deployment rules limit it to these tags. The rules are
    # the environment's own (Settings → Environments → testflight): a tag
    # pattern that isn't listed there is turned away before any step runs.
    environment: testflight
    # Lifted to the job because a step's `if:` can read `env` but not
    # `secrets`: without a key the run stops at a notice instead of failing.
    env:
      ASC_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      # The store app's Apple ID in App Store Connect (App Information). A
      # version tag's build is made for whichever app this names
      # (build/asc-app-bundle-id.swift); a preview's isn't, and doesn't read it.
      STORE_ASC_APP_ID: ${{ vars.SOLO_ASC_APP_ID }}
    defaults:
      run:
        working-directory: src/Solo.iOS
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, so the gate can diff against the last uploaded build.
          fetch-depth: 0

      - name: Classify the release
        id: channel
        working-directory: .
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            bash build/release-channel.sh "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            # Which of the two apps the tag is for. A version tag is the store
            # app's whether or not its version has a suffix (v1.22.0-rc.1).
            case "$GITHUB_REF_NAME" in
              v*) echo "app=store" ;;
              *)  echo "app=preview" ;;
            esac >> "$GITHUB_OUTPUT"
          else
            printf 'version=0.0.0-preview.%s\npackage_label=\napp=preview\n' "$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          fi

      # A Design Docs package preview (preview-v…-design-docs-<label>.N) ships
      # an extension zip, not the app. Otherwise build/testflight-gate.sh skips
      # a preview tag that leaves the app as testers already have it, which is
      # most of them: the app talks to its instance over the API and carries
      # none of the server, so a server change doesn't reach it. A version tag
      # isn't asked: there are few of them, each is a release made on purpose
      # under a version the store app hasn't had, and it always uploads.
      - name: Check what this run uploads
        id: gate
        working-directory: .
        env:
          APP: ${{ steps.channel.outputs.app }}
          PACKAGE_LABEL: ${{ steps.channel.outputs.package_label }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -n "$PACKAGE_LABEL" ]; then
            echo "::notice::A Design Docs package preview; no app upload."
            echo "upload=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$ASC_KEY" ] || [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$APPLE_TEAM_ID" ]; then
            echo "::notice::No App Store Connect key in the testflight environment; skipping the upload."
            echo "upload=false" >> "$GITHUB_OUTPUT"
          elif [ "$APP" = store ]; then
            if [ -z "$STORE_ASC_APP_ID" ]; then
              echo "::notice::SOLO_ASC_APP_ID isn't set in the testflight environment, so there is no store app to upload to; skipping the upload."
              echo "upload=false" >> "$GITHUB_OUTPUT"
            else
              printf '### TestFlight upload\n\nA version tag: it uploads to the store app, the one SOLO_ASC_APP_ID names.\n' >> "$GITHUB_STEP_SUMMARY"
              echo "upload=true" >> "$GITHUB_OUTPUT"
            fi
          else
            bash build/testflight-gate.sh ios >> "$GITHUB_OUTPUT"
          fi

      # The newest release (non-beta) Xcode 27 on the image. Fails rather
      # than fall back to a beta, which App Store Connect would reject.
      - name: Select Xcode 27
        if: steps.gate.outputs.upload == 'true'
        run: |
          set -euo pipefail
          sudo xcode-select -s "$(ls -d /Applications/Xcode_27*.app | grep -v -i beta | sort -V | tail -1)"
          xcodebuild -version

      - name: Write the App Store Connect key
        if: steps.gate.outputs.upload == 'true'
        working-directory: .
        run: build/write-asc-key.sh "$RUNNER_TEMP/asc.p8"

      # Which app the build is made as: its bundle id, and for the preview its
      # own name and icon. The preview's bundle id is the Capacitor preview's,
      # so it is the same App Store Connect app and testers get this as an
      # update to the one they have. The store app's is asked of App Store
      # Connect, for the app SOLO_ASC_APP_ID names: an upload is filed by
      # bundle id, so that is what makes the build go to that app and no other
      # (build/asc-app-bundle-id.swift). The store app keeps the project's own
      # name and icon, "Solo" and Solo/Solo.icon.
      - name: Choose the app
        id: app
        if: steps.gate.outputs.upload == 'true'
        working-directory: .
        env:
          APP: ${{ steps.channel.outputs.app }}
        run: |
          set -euo pipefail
          if [ "$APP" = store ]; then
            bundle=$(swift build/asc-app-bundle-id.swift "$RUNNER_TEMP/asc.p8" "$STORE_ASC_APP_ID")
            # Never the preview's: that would put a version tag's build in
            # front of the preview's testers, as theirs.
            if [ "$bundle" = com.hunterahlquist.solo.preview ]; then
              echo "::error::SOLO_ASC_APP_ID names the preview app. It should be the store app's Apple ID."
              exit 1
            fi
            echo "Building for $bundle, the app SOLO_ASC_APP_ID names."
            { echo "bundle_id=$bundle"; echo "name="; echo "icon="; } >> "$GITHUB_OUTPUT"
          else
            { echo "bundle_id=com.hunterahlquist.solo.preview"; echo "name=Solo (Preview)"; echo "icon=Solo Preview"; } >> "$GITHUB_OUTPUT"
          fi

      # The project keeps the store's icon (Solo/Solo.icon). The preview's is
      # in Icons with the desktop's; the app's folder is one the project reads
      # whole, so a file put in it is in the target without being listed.
      - name: Stage the preview icon
        if: steps.gate.outputs.upload == 'true' && steps.app.outputs.icon != ''
        run: cp -R "../../Icons/Solo Preview.icon" "Solo/Solo Preview.icon"

      # Release, as the app chosen above. The bundle id goes through
      # SOLO_BUNDLE_ID, which the app, its widgets and its tests each build
      # their own from, where PRODUCT_BUNDLE_IDENTIFIER on the command line
      # would give every target, the packages included, the same one. The team
      # is given here and nowhere in the project. The build number only has to
      # be one this version hasn't had, and grow: it is the minute of the
      # build, in UTC. The Capacitor port's builds took the run's number, and
      # this app's can't carry on from theirs — a workflow that isn't on the
      # default branch keeps its count only as long as its runs are kept — but
      # any minute is past every number that got.
      # The marketing version drops the prerelease suffix: iOS takes three
      # numbers only. The two -skip flags are for a runner with nobody at it to
      # be asked whether a package's macro or plug-in may run.
      - name: Archive
        if: steps.gate.outputs.upload == 'true'
        env:
          VERSION: ${{ steps.channel.outputs.version }}
          BUNDLE_ID: ${{ steps.app.outputs.bundle_id }}
          APP_NAME: ${{ steps.app.outputs.name }}
          APP_ICON: ${{ steps.app.outputs.icon }}
        run: |
          set -euo pipefail
          # Said only for the preview: the store app's are the project's own.
          identity=()
          [ -z "$APP_NAME" ] || identity+=("INFOPLIST_KEY_CFBundleDisplayName=$APP_NAME")
          [ -z "$APP_ICON" ] || identity+=("ASSETCATALOG_COMPILER_APPICON_NAME=$APP_ICON")
          xcodebuild archive \
            -project Solo.xcodeproj -scheme Solo -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Solo.xcarchive" \
            -skipPackagePluginValidation -skipMacroValidation \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            MARKETING_VERSION="${VERSION%%-*}" \
            CURRENT_PROJECT_VERSION="$(date -u +%Y%m%d%H%M)" \
            SOLO_BUNDLE_ID="$BUNDLE_ID" \
            ${identity[@]+"${identity[@]}"}

      # ExportOptions-testflight.plist uploads straight to App Store Connect
      # and marks the build internal-only, so it can't reach external testers
      # or a review by accident. The step's name is how build/testflight-gate.sh
      # recognises a run that uploaded; rename both together.
      - name: Upload
        if: steps.gate.outputs.upload == 'true'
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Solo.xcarchive" \
            -exportOptionsPlist ExportOptions-testflight.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      # Signing the archive made an "Apple Development: Created via API"
      # certificate whose key leaves with this runner; left alone, they pile
      # up until Apple refuses another. This revokes that one, matched by
      # serial against this runner's keychain, and never fails the job. It runs
      # after a failure too, since the archive makes the certificate first.
      - name: Revoke this run's development certificate
        if: always() && steps.gate.outputs.upload == 'true'
        working-directory: .
        run: swift build/asc-revoke-run-certificates.swift "$RUNNER_TEMP/asc.p8"

      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/asc.p8"
