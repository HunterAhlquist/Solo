name: Mac TestFlight

on:
  push:
    # Previews only: a `preview-v*` tag uploads the Mac App Store build to
    # TestFlight for internal testers. Stable `v*` tags don't, and there is no
    # manual run, until the app is ready for more than that. The
    # direct-download app (release-desktop.yml) is unaffected either way.
    tags: ["preview-v*"]

permissions:
  contents: read

jobs:
  testflight:
    name: Upload to TestFlight
    # The Xcode 27 image, as for the iOS upload: macos-latest's Xcode 26.6
    # can't compile the icon's `refractivity`, and a release Xcode is picked
    # below because App Store Connect turns away beta toolchains.
    runs-on: xcode-27
    timeout-minutes: 45
    # The same environment as the iOS upload: the App Store Connect key can
    # publish builds, so its deployment rules limit it to preview tags.
    environment: testflight
    # Lifted to the job because a step's `if:` can read `env` but not
    # `secrets`: without them the run stops at a notice instead of failing.
    env:
      ASC_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      # One .p12 holding both the Apple Distribution and the Mac Installer
      # Distribution identities, base64.
      MAS_CERTIFICATES: ${{ secrets.MAS_CERTIFICATES }}
      MAS_CERTIFICATES_PASSWORD: ${{ secrets.MAS_CERTIFICATES_PASSWORD }}
      # The Mac App Store profile for com.hunterahlquist.solo.preview, base64.
      MAS_PROVISIONING_PROFILE: ${{ secrets.MAS_PREVIEW_PROVISIONING_PROFILE }}
      # The app's Apple ID in App Store Connect (App Information), which altool
      # files the build under. Shared with the iOS preview: one app, two platforms.
      ASC_APP_ID: ${{ vars.SOLO_PREVIEW_ASC_APP_ID }}
    defaults:
      run:
        working-directory: src/Solo.Desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Classify the release
        id: channel
        working-directory: .
        run: bash build/release-channel.sh "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

      # A Design Docs package preview (preview-v…-design-docs-<label>.N) ships
      # an extension zip, not the app.
      - name: Check what this run uploads
        id: gate
        env:
          PACKAGE_LABEL: ${{ steps.channel.outputs.package_label }}
          PRERELEASE: ${{ steps.channel.outputs.prerelease }}
        run: |
          # The trigger already limits this to preview tags; this keeps a
          # stable version from uploading if that ever changes.
          if [ "$PRERELEASE" != true ]; then
            echo "::notice::Not a preview version; only previews go to TestFlight for now."
            echo "upload=false" >> "$GITHUB_OUTPUT"
          elif [ -n "$PACKAGE_LABEL" ]; then
            echo "::notice::A Design Docs package preview; no app upload."
            echo "upload=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$ASC_KEY" ] || [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_APP_ID" ] ||
               [ -z "$MAS_CERTIFICATES" ] || [ -z "$MAS_CERTIFICATES_PASSWORD" ] || [ -z "$MAS_PROVISIONING_PROFILE" ]; then
            echo "::notice::The testflight environment is missing the Mac App Store secrets or SOLO_PREVIEW_ASC_APP_ID; skipping the upload."
            echo "upload=false" >> "$GITHUB_OUTPUT"
          else
            echo "upload=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        if: steps.gate.outputs.upload == 'true'
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.gate.outputs.upload == 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/Solo.Desktop/package-lock.json

      - name: Install dependencies
        if: steps.gate.outputs.upload == 'true'
        run: npm ci

      # The newest release (non-beta) Xcode 27 on the image. Fails rather
      # than fall back to a beta, which App Store Connect would reject.
      - name: Select Xcode 27
        if: steps.gate.outputs.upload == 'true'
        run: |
          set -euo pipefail
          sudo xcode-select -s "$(ls -d /Applications/Xcode_27*.app | grep -v -i beta | sort -V | tail -1)"
          xcrun actool --version | grep short-bundle-version

      # The preview name and icon come from the prerelease version, as they do
      # for the downloaded preview; the store bundle id from `mas` in
      # electron-builder.config.cjs.
      - name: Stamp release identity
        if: steps.gate.outputs.upload == 'true'
        env:
          VERSION: ${{ steps.channel.outputs.version }}
        run: |
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          node -e 'console.log("DESKTOP_PRODUCT_NAME=" + require("./electron-builder.config.cjs").productName)' >> "$GITHUB_ENV"

      - name: Verify desktop isolation
        if: steps.gate.outputs.upload == 'true'
        run: |
          npm run test:app-identity
          npm run test:updater

      - name: Publish Blazor client into shell
        if: steps.gate.outputs.upload == 'true'
        run: npm run build:client

      - name: Build the macOS sign-in window
        if: steps.gate.outputs.upload == 'true'
        run: |
          npm run build:native
          node -e "const m = require('./native/auth-session/build/Release/auth_session.node'); if (typeof m.start !== 'function') process.exit(1)"

      # Our own keychain rather than electron-builder's CSC_LINK import, for
      # the reason given at the same step in release-desktop.yml. productbuild
      # is allowed in because the installer identity signs the .pkg.
      - name: Import signing certificates
        id: keychain
        if: steps.gate.outputs.upload == 'true'
        run: |
          set -euo pipefail
          KEYCHAIN="${RUNNER_TEMP}/solo-mas.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          CERT="${RUNNER_TEMP}/mas.p12"

          echo "$MAS_CERTIFICATES" | base64 --decode > "$CERT"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT" -k "$KEYCHAIN" -P "$MAS_CERTIFICATES_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          EXISTING=()
          while IFS= read -r line; do
            EXISTING+=("$(printf '%s' "$line" | sed -e 's/^[[:space:]]*"//' -e 's/"$//')")
          done < <(security list-keychains -d user)
          if [ ${#EXISTING[@]} -gt 0 ]; then
            security list-keychains -d user -s "$KEYCHAIN" "${EXISTING[@]}"
          else
            security list-keychains -d user -s "$KEYCHAIN"
          fi
          rm -f "$CERT"

          # Both halves have to be there, or electron-builder fails much later
          # with a less useful message. The installer identity isn't a
          # codesigning one, so it's looked for among all identities.
          security find-identity -v -p codesigning "$KEYCHAIN" | tee "${RUNNER_TEMP}/identities"
          grep -q "Apple Distribution" "${RUNNER_TEMP}/identities" || {
            echo "::error::MAS_CERTIFICATES has no Apple Distribution identity."; exit 1; }
          security find-identity -v "$KEYCHAIN" | grep -q "3rd Party Mac Developer Installer" || {
            echo "::error::MAS_CERTIFICATES has no Mac Installer Distribution identity (named \"3rd Party Mac Developer Installer\")."; exit 1; }
          echo "CSC_KEYCHAIN=${KEYCHAIN}" >> "$GITHUB_ENV"

      - name: Write the provisioning profile
        if: steps.gate.outputs.upload == 'true'
        run: |
          PROFILE="${RUNNER_TEMP}/solo-mas.provisionprofile"
          echo "$MAS_PROVISIONING_PROFILE" | base64 --decode > "$PROFILE"
          echo "SOLO_MAS_PROVISIONING_PROFILE=${PROFILE}" >> "$GITHUB_ENV"

      # The `mas` target downloads Electron's Mac App Store build (process.mas,
      # no autoUpdater or crashReporter), signs it for the sandbox, and wraps
      # it in a signed .pkg. --arm64 matches the downloaded app: Apple silicon
      # only. The build number only has to grow, which the run number does.
      - name: Package
        if: steps.gate.outputs.upload == 'true'
        env:
          SOLO_MAS_BUILD_NUMBER: ${{ github.run_number }}
        run: npx electron-builder --config electron-builder.config.cjs --mac mas --arm64 --publish never

      - name: Write the App Store Connect key
        if: steps.gate.outputs.upload == 'true'
        working-directory: .
        run: build/write-asc-key.sh "$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8"

      # Lands in TestFlight, where only internal testers see it: nothing reaches
      # external testers or App Review until someone adds it there by hand. The
      # verdict is read from altool's output, because altool has exited 0 on a
      # failed upload.
      - name: Upload
        if: steps.gate.outputs.upload == 'true'
        env:
          API_PRIVATE_KEYS_DIR: ${{ runner.temp }}/private_keys
          VERSION: ${{ steps.channel.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          PKGS=(dist/mas-arm64/*.pkg)
          if [ ${#PKGS[@]} -ne 1 ]; then
            echo "::error::Expected one .pkg in dist/mas-arm64, found ${#PKGS[@]}."
            exit 1
          fi
          BUNDLE_ID=$(node -e 'console.log(require("./electron-builder.config.cjs").mas.appId)')
          LOG="${RUNNER_TEMP}/altool.log"
          xcrun altool --upload-package "${PKGS[0]}" --type macos \
            --apple-id "$ASC_APP_ID" --bundle-id "$BUNDLE_ID" \
            --bundle-version "$BUILD_NUMBER" --bundle-short-version-string "${VERSION%%-*}" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" 2>&1 | tee "$LOG" || true
          if ! grep -Eq "UPLOAD SUCCEEDED|No errors uploading" "$LOG"; then
            echo "::error::altool did not report a successful upload; its output is above."
            exit 1
          fi

      - name: Remove the key and profile
        if: always()
        run: rm -rf "$RUNNER_TEMP/private_keys" "$RUNNER_TEMP/solo-mas.provisionprofile"

      - name: Remove signing keychain
        if: always() && steps.keychain.outcome == 'success'
        run: security delete-keychain "${RUNNER_TEMP}/solo-mas.keychain-db"
