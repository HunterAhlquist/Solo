<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Solo is a private application: keep it out of search indexes and AI
       overviews. The X-Robots-Tag response header (Solo.Api/SecurityHeaders.cs)
       is the authoritative control; this tag covers the initial shell before
       the app boots. -->
  <meta name="robots" content="noindex, nofollow" />
  <title>Solo</title>
  <base href="/" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
  <link rel="stylesheet" href="_content/MudBlazor/MudBlazor.min.css" />
  <link rel="stylesheet" href="css/app.css" />
  <!-- Before the body paints: colours the boot splash in the active theme and
       scheme rather than the built-in default. -->
  <script src="js/theme-boot.js"></script>
</head>
<body>
<div id="app">
  <div class="boot-splash">
    <div class="boot-splash__panel" role="status" aria-label="Loading Solo">
      <!-- Its text is in app.css, so that theme-boot.js can swap in the
           instance's own name before the first paint. -->
      <div class="boot-splash__mark"></div>
      <div class="boot-splash__bar"><span></span></div>
    </div>
  </div>
</div>

<div id="blazor-error-ui">
  Something went wrong. Reload the page to continue.
  <a href="." class="reload">Reload</a>
  <span class="dismiss">🗙</span>
</div>

<script src="_content/MudBlazor/MudBlazor.min.js"></script>
<!-- Defines highlightCodeElement, which MudMarkdown calls for every fenced code
     block; without it a description with a code fence fails to render. Its
     stylesheet is deliberately not linked: it restyles every heading, list and
     paragraph in rendered markdown, not just code. -->
<script src="_content/MudBlazor.Markdown/MudBlazor.Markdown.min.js"></script>
<script src="_content/Microsoft.AspNetCore.Components.WebAssembly.Authentication/AuthenticationService.js"></script>
<script src="js/solo-interop.js"></script>
<script src="js/drag.js"></script>
<script src="_framework/blazor.webassembly.js"></script>
</body>
</html>
