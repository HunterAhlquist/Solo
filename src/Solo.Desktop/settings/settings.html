<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Solo — Settings</title>
  <style>
    /* Matches the client's boot-splash aesthetic while following the native
       appearance Electron resolved from Solo's theme preference. */
    :root {
      --bg: #000000;
      --fg: #ffffff;
      --dim: #9a9a9a;
      --accent: #fff600;
      --error: #ff5252;
      --ok: #6fdc6f;
      --line: #2a2a2a;
      --input-bg: #0a0a0a;
      --glass-wash: rgb(0 0 0 / 48%);
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f7f4ee;
        --fg: #171717;
        --dim: #66615a;
        --accent: #b94f08;
        --error: #b42318;
        --ok: #287a35;
        --line: #cfc7bc;
        --input-bg: rgb(255 255 255 / 68%);
        --glass-wash: rgb(247 244 238 / 48%);
      }
    }

    * { box-sizing: border-box; }

    /* The attribute alone loses to any rule that sets display, .buttons among them. */
    [hidden] { display: none !important; }

    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: "Courier New", monospace;
      user-select: none;
    }

    html.solo-settings--glass,
    html.solo-settings--glass body {
      background: transparent;
    }

    html.solo-settings--glass body {
      -webkit-app-region: drag;
    }

    html.solo-settings--glass :is(input, button, label, a, ul, [role="button"]) {
      -webkit-app-region: no-drag;
    }

    html.solo-settings--glass body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      background: var(--glass-wash);
      -webkit-backdrop-filter: blur(28px) saturate(125%);
      backdrop-filter: blur(28px) saturate(125%);
      pointer-events: none;
    }

    main {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      height: 100%;
      padding: 1.5rem 1.75rem;
      position: relative;
      z-index: 1;
    }

    html.solo-settings--glass main {
      padding-top: 3.25rem;
    }

    h1 {
      margin: 0;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--accent);
    }

    p.hint {
      margin: 0;
      font-size: 0.75rem;
      line-height: 1.5;
      color: var(--dim);
    }

    label {
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--dim);
    }

    input {
      width: 100%;
      padding: 0.6rem 0.75rem;
      border: 1px solid var(--line);
      border-radius: 0;
      background: var(--input-bg);
      color: var(--fg);
      font: inherit;
      user-select: text;
    }

    input:focus {
      outline: none;
      border-color: var(--accent);
    }

    #instances {
      flex: 1;
      min-height: 4rem;
      margin: 0;
      padding: 0;
      overflow-y: auto;
      list-style: none;
      border-top: 1px solid var(--line);
    }

    #instances li {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      padding: 0.6rem 0;
      border-bottom: 1px solid var(--line);
    }

    #instances .about {
      flex: 1;
      min-width: 0;
    }

    #instances strong,
    #instances small {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #instances strong {
      font-size: 0.8rem;
    }

    #instances small {
      margin-top: 0.2rem;
      color: var(--dim);
      font-size: 0.68rem;
      user-select: text;
    }

    #instances .open-mark {
      margin-left: 0.5rem;
      color: var(--ok);
      font-size: 0.62rem;
      font-weight: 400;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    #instances button {
      padding: 0.35rem 0.7rem;
      font-size: 0.7rem;
    }

    .add {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.35rem;
    }

    #status {
      min-height: 2.75rem;
      font-size: 0.75rem;
      line-height: 1.5;
      white-space: pre-wrap;
      color: var(--dim);
    }

    #status.ok { color: var(--ok); }
    #status.error { color: var(--error); }

    .native-effects {
      padding: 0.85rem 0;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    .native-effects label {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 0.75rem;
      align-items: start;
      color: var(--fg);
      letter-spacing: normal;
      text-transform: none;
      cursor: pointer;
    }

    .native-effects input {
      width: 1rem;
      height: 1rem;
      margin: 0.1rem 0 0;
      padding: 0;
      accent-color: var(--accent);
    }

    .native-effects strong {
      display: block;
      font-size: 0.78rem;
    }

    .native-effects small {
      display: block;
      margin-top: 0.3rem;
      color: var(--dim);
      font-size: 0.68rem;
      line-height: 1.45;
    }

    .buttons {
      display: flex;
      gap: 0.75rem;
      justify-content: flex-end;
    }

    button {
      padding: 0.55rem 1.1rem;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--fg);
      font: inherit;
      font-size: 0.8rem;
      cursor: pointer;
    }

    button:hover:not(:disabled) {
      border-color: var(--accent);
      color: var(--accent);
    }

    button.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: #000;
      font-weight: 700;
    }

    button.primary:hover:not(:disabled) {
      background: transparent;
      color: var(--accent);
    }

    button:disabled {
      opacity: 0.4;
      cursor: default;
    }

    .origin {
      color: var(--accent);
      user-select: text;
    }
  </style>
</head>
<body>
<main>
  <h1>Instances</h1>
  <p class="hint">
    The Solo instances this app connects to. Each one opens in a window of its
    own; open them from here or from the <span class="origin">Open Instance</span> menu.
  </p>

  <ul id="instances"></ul>

  <div>
    <label for="url">Add an instance</label>
    <div class="add">
      <input id="url" type="text" spellcheck="false" autocomplete="off"
             placeholder="https://solo.example.com" />
      <button id="add" type="button" class="primary">Add</button>
    </div>
  </div>

  <div id="status"></div>

  <div id="sign-in-actions" class="buttons" hidden>
    <button id="open-new" type="button">Open without signing in</button>
    <button id="sign-in" type="button">Sign in again</button>
  </div>

  <section id="native-effects-setting" class="native-effects" hidden>
    <label for="native-effects">
      <input id="native-effects" type="checkbox" />
      <span>
        <strong>Use macOS native window effects</strong>
        <small>Uses Liquid Glass when supported and vibrancy otherwise. Changes apply after restarting Solo.</small>
      </span>
    </label>
  </section>

  <div class="buttons">
    <button id="close" type="button">Close</button>
  </div>
</main>

<script>
  const list = document.getElementById('instances');
  const urlInput = document.getElementById('url');
  const status = document.getElementById('status');
  const addButton = document.getElementById('add');
  const closeButton = document.getElementById('close');
  const signInActions = document.getElementById('sign-in-actions');
  const nativeEffectsSetting = document.getElementById('native-effects-setting');
  const nativeEffectsInput = document.getElementById('native-effects');

  let instances = [];
  let busy = false;
  // { id, name } of an instance just added, while its first sign-in is open in
  // the browser. Main closes this window when that sign-in lands.
  let awaiting = null;

  function setStatus(text, kind) {
    status.textContent = text;
    status.className = kind ?? '';
  }

  function element(tag, text, className) {
    const node = document.createElement(tag);
    node.textContent = text;
    if (className) node.className = className;
    return node;
  }

  function render() {
    list.replaceChildren(...instances.map(instance => {
      const name = element('strong', instance.name);
      if (instance.open) {
        name.append(element('span', 'Open', 'open-mark'));
      }

      // The local address is the origin a provider other than Google has to
      // be told about, so it is shown rather than left for settings.json.
      const about = element('div', '', 'about');
      about.append(name, element('small', instance.url), element('small', `Local address ${instance.origin}`));

      const open = element('button', instance.open ? 'Show' : 'Open');
      open.type = 'button';
      open.disabled = busy;
      open.addEventListener('click', () => window.soloSettings.open(instance.id));

      const remove = element('button', 'Remove');
      remove.type = 'button';
      remove.disabled = busy;
      remove.addEventListener('click', () => window.soloSettings.remove(instance.id));

      const row = document.createElement('li');
      row.append(about, open, remove);
      return row;
    }));

    addButton.disabled = busy || awaiting !== null;
    urlInput.disabled = busy || awaiting !== null;
    signInActions.hidden = awaiting === null;
    // With no instance window open, this window is the last one: closing it
    // ends the app, and the button should say so.
    closeButton.textContent = instances.some(instance => instance.open) ? 'Close' : 'Quit';
  }

  async function add() {
    if (busy || awaiting) return;

    busy = true;
    render();
    setStatus('Testing the connection…');
    const result = await window.soloSettings.add(urlInput.value);
    busy = false;

    if (!result.ok) {
      setStatus(result.error, 'error');
      render();
      urlInput.focus();
      return;
    }

    urlInput.value = '';
    if (result.signIn) {
      awaiting = { id: result.id, name: result.name };
      setStatus(`Connected to ${result.name}.\nFinish signing in in your browser — it opens here once you have.`, 'ok');
    } else {
      // Nothing to sign in to yet from here; main is opening its window.
      setStatus(`Connected to ${result.name}. Opening…`, 'ok');
    }
    render();
  }

  addButton.addEventListener('click', add);
  urlInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') add();
  });

  document.getElementById('sign-in').addEventListener('click', () => {
    if (!awaiting) return;
    setStatus(`Finish signing in to ${awaiting.name} in your browser — it opens here once you have.`, 'ok');
    window.soloSettings.signIn(awaiting.id);
  });
  document.getElementById('open-new').addEventListener('click', () => {
    if (awaiting) window.soloSettings.openNew(awaiting.id);
  });

  nativeEffectsInput.addEventListener('change', () =>
    window.soloSettings.setNativeEffects(nativeEffectsInput.checked));

  closeButton.addEventListener('click', () => window.soloSettings.close());
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') window.soloSettings.close();
  });

  window.soloSettings.onInstancesChanged(current => {
    instances = current;
    if (awaiting && !instances.some(instance => instance.id === awaiting.id)) {
      // Removed while its sign-in was still open.
      awaiting = null;
      setStatus('');
    }
    render();
  });

  window.soloSettings.onSignInFailed(({ id, message }) => {
    if (awaiting?.id === id) {
      setStatus(message, 'error');
    }
  });

  window.soloSettings.get().then(({ instances: current, nativeEffects, platform, firstRun }) => {
    instances = current;
    nativeEffectsInput.checked = nativeEffects;
    nativeEffectsSetting.hidden = platform !== 'darwin';
    if (firstRun) {
      setStatus('Welcome. Add your Solo instance to get started.');
    }
    render();
    urlInput.focus();
  });
</script>
</body>
</html>
