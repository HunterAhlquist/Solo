<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; script-src 'self'" />
  <title>Updating Solo</title>
  <style>
    /* The About window's palette (about/about.html), with Solo's primary for
       the bar: orange in the light theme, yellow in the dark. */
    :root {
      --bg: #f2f2f4;
      --fg: #1d1d1f;
      --dim: #6e6e73;
      --track: rgb(0 0 0 / 10%);
      --fill: #df6610;
      --button: #ffffff;
      --button-border: rgb(0 0 0 / 14%);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #262628;
        --fg: #f5f5f7;
        --dim: #98989d;
        --track: rgb(255 255 255 / 12%);
        --fill: #fff600;
        --button: rgb(255 255 255 / 12%);
        --button-border: rgb(255 255 255 / 10%);
      }
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      padding: 28px 20px 16px;
      display: flex;
      gap: 14px;
      background: var(--bg);
      color: var(--fg);
      font: 12px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      user-select: none;
      cursor: default;
      -webkit-app-region: drag;
    }

    img { width: 56px; height: 56px; flex: none; }

    main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }

    h1 { margin: 0; font-size: 13px; font-weight: 700; }

    .track {
      position: relative;
      height: 6px;
      border-radius: 3px;
      background: var(--track);
      overflow: hidden;
    }

    .fill {
      position: absolute;
      inset: 0 auto 0 0;
      width: 0;
      border-radius: 3px;
      background: var(--fill);
      transition: width 200ms linear;
    }

    /* Before the first figures arrive — electron-updater may still be fetching
       block maps for a differential download — the bar says "working" rather
       than sitting at an empty 0%. */
    .track.indeterminate .fill {
      width: 30%;
      transition: none;
      animation: sweep 1.1s ease-in-out infinite alternate;
    }

    @keyframes sweep {
      from { left: 0; }
      to { left: 70%; }
    }

    footer { display: flex; align-items: center; gap: 12px; }

    #status {
      flex: 1;
      min-width: 0;
      color: var(--dim);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    button {
      -webkit-app-region: no-drag;
      padding: 3px 14px;
      border: 1px solid var(--button-border);
      border-radius: 6px;
      background: var(--button);
      color: var(--fg);
      font: inherit;
    }

    button:disabled { opacity: 0.5; }
  </style>
</head>
<body>
  <img src="../about/logo.png" alt="" draggable="false" />
  <main>
    <h1 id="heading">Downloading update…</h1>
    <div class="track indeterminate" role="progressbar" aria-labelledby="heading">
      <div class="fill"></div>
    </div>
    <footer>
      <span id="status">Starting download…</span>
      <button id="cancel" type="button">Cancel</button>
    </footer>
  </main>
  <script src="update-progress.js"></script>
</body>
</html>
