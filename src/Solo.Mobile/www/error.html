<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Solo</title>
  <style>
    :root { color-scheme: light dark; }
    body { font: 16px -apple-system, system-ui, sans-serif; margin: 0; min-height: 100vh;
           display: grid; place-items: center; text-align: center; padding: 1.5rem; box-sizing: border-box; }
    h1 { font-size: 1.4rem; margin: 0 0 .5rem; }
    p { margin: 0 0 1.5rem; opacity: .75; }
    button { font: inherit; padding: .6rem 1.4rem; border-radius: 999px; border: 1px solid currentColor;
             background: none; color: inherit; }
  </style>
</head>
<body>
  <main>
    <h1>Can’t reach Solo</h1>
    <p>Check your connection, then try again or reopen the app.</p>
    <button type="button" onclick="history.length > 1 ? history.back() : location.reload()">Try again</button>
  </main>
</body>
</html>
