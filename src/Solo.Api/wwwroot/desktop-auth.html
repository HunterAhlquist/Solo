<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in to Solo</title>
  <style>
    /* Matches the client's boot-splash aesthetic: black, #fff600, Courier. */
    :root {
      --bg: #000000;
      --fg: #ffffff;
      --dim: #9a9a9a;
      --accent: #fff600;
      --error: #ff5252;
      --ok: #6fdc6f;
    }

    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: "Courier New", monospace;
    }

    main {
      display: grid;
      place-content: center;
      gap: 1.5rem;
      height: 100vh;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--accent);
    }

    p {
      margin: 0;
      max-width: 34rem;
      font-size: 0.85rem;
      line-height: 1.6;
      color: var(--dim);
    }

    #button {
      display: flex;
      justify-content: center;
      min-height: 44px;
    }

    #status.ok { color: var(--ok); }
    #status.error { color: var(--error); }
  </style>
</head>
<body>
<main>
  <h1>Solo</h1>
  <p id="lead">
    Continue only if you just started sign-in from Solo Desktop on this device.
    After Google verifies you, this browser will return to the local app.
  </p>
  <div id="button"></div>
  <p id="status"></p>
</main>

<!-- Relative, so this resolves next to the page on a sub-path instance too.
     Must stay an external file: the instance CSP has no script 'unsafe-inline'. -->
<script src="desktop-auth.js"></script>
</body>
</html>
